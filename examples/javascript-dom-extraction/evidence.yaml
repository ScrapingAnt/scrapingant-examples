claims:
  - id: JS1
    text: Three live catalog requests produced all three expected records through a DOM JSON carrier.
    source: comparison.json; expected_output/live/catalog_1.html; expected_output/live/catalog_2.html; expected_output/live/catalog_3.html
  - id: JS2
    text: The return-only control returned HTTP 200 without a carrier; returning a JavaScript object alone did not create the HTML result.
    source: expected_output/live/live.json; expected_output/live/return_only.html
  - id: JS3
    text: A missing selector returned HTTP 200 with a valid ok-false ELEMENT_MISSING envelope.
    source: expected_output/live/live.json; expected_output/live/missing_selector.html
  - id: JS4
    text: The delayed fixture result and an awaited operation were present in the live returned DOM.
    source: expected_output/live/delayed.html; expected_output/live/live.json
  - id: JS5
    text: Python and Node recovered the exact synthetic special-character probe from all three live catalog responses.
    source: summarize.py; comparison.json; expected_output/node-quickstart.json
  - id: JS6
    text: Exact framing rejects absent or duplicate markers; schema validation is separate from application record validation.
    source: protocol.py; parse-marker.mjs; state.py; expected_output/python-tests.txt; expected_output/node-tests.txt
  - id: JS7
    text: Python additionally rejects duplicate JSON object keys; native Node JSON.parse does not.
    source: protocol.py; parse-marker.mjs; test_protocol.py
  - id: JS8
    text: Browser-enabled custom JavaScript is Base64 encoded, URL encoded as a query parameter and executed after page load; the general endpoint returns HTML.
    source: https://docs.scrapingant.com/javascript-execution; https://docs.scrapingant.com/request-response-format
    accessed_at: 2026-09-28
  - id: JS9
    text: Escaping less-than as a JSON unicode escape prevents literal closing-script text in the raw-text carrier while preserving the decoded value.
    source: snippet.js; test_protocol.py; test-protocol.mjs; https://html.spec.whatwg.org/multipage/scripting.html#restrictions-for-contents-of-script-elements
    accessed_at: 2026-09-28
limitations:
  - One run window and two self-authored public fixture URLs; no production reliability, latency or anti-bot measurement.
  - Four success envelopes plus two deliberate controls; six expected outcomes are not six successful data extractions.
  - Native DOM selectors only; automation-library-specific selector engines are not installed in the API page.
  - A nonce reduces accidental collisions but does not authenticate data from a hostile page.
  - No Markdown carrier, pagination, multi-step session, localStorage operation, closed shadow root or cross-origin frame test.
  - Initial local charset failure is preserved separately and excluded from final denominators.
  - Local browser version does not identify the API worker browser.
verification: verification.json
