# Evidence manifest for https://scrapingant.com/blog/requests-vs-httpx
article_id: requests-vs-httpx
canonical_url: https://scrapingant.com/blog/requests-vs-httpx
owner: Oleg Kulyk
examples_repo_commit: "<sha, filled after commit>"
tested_at: 2026-09-17
requires_api_key: false   # 11_scrapingant.py runs only when SCRAPINGANT_API_KEY is set and prints "skipped" otherwise
environment:
  os: macOS 26 (Darwin 25.6.0, arm64, Apple Silicon)
  python: "3.12.11 (.venv)"
  openssl_python: "OpenSSL 3.0.16"
  openssl_cli: "OpenSSL 3.3.0"
dependencies:
  requests: "2.34.2"
  urllib3: "2.8.0"
  httpx: "0.28.1"
  httpcore: "1.0.9"
  h2: "4.4.1"
  anyio: "4.15.1"
  hypercorn: "0.18.0"
  httpx_prerelease_tested: "1.0.dev6"   # installed into generated/ by 09_httpx1_preview.py
run_command: ./run.sh
fixtures:
  - server.py (hypercorn ASGI app; plain HTTP 127.0.0.1:8080 and [::1]:8080, TLS+ALPN h2 on 127.0.0.1:8443 and [::1]:8443, certs/localhost.pem generated by run.sh)
  - https://scrapingant.github.io/scrapingant-examples/fixtures/dynamic-delayed.html (05, one HTTP/2 request; 11 when a key is set)
  - https://hugovk.github.io/top-pypi-packages/top-pypi-packages.min.json (10)
outputs:
  - expected_output/00_versions.txt … 11_scrapingant.txt (one file per script), expected_output/popularity.json
measurements:
  - {name: sequential_300_plain_session_vs_client, value: "0.150 s vs 0.126 s", unit: s, denominator: "300 GET /get, median of 5 runs, 1 connection", source: expected_output/03_pooling.txt}
  - {name: httpx_get_no_client_plain, value: "3.090 s (default verify) vs 0.186 s (verify=ctx)", unit: s, denominator: "300 GET /get, median of 5", source: expected_output/03_pooling.txt}
  - {name: concurrency_200_delay50ms, value: "threads 0.543/0.541/0.545 s, asyncio semaphore 0.558 s, sequential 10.422 s", unit: s, denominator: "200 GET /delay/0.05, concurrency 20, median of 3", source: expected_output/04_concurrency.txt}
  - {name: http2_vs_http11_200_inflight_tls, value: "0.170 s / 1 conn vs 0.469 s / 200 conns", unit: s, denominator: "200 GET /delay/0.05 over TLS, no semaphore, median of 3", source: expected_output/05_http2.txt}
  - {name: streaming_50MiB_peak_rss, value: "requests 148 → 35 MiB, httpx 151 → 44 MiB", unit: MiB, denominator: "50 MiB body, one process per case, median of 3", source: expected_output/06_streaming.txt}
  - {name: retries_503_requests_sent, value: "urllib3 Retry: 4, httpx HTTPTransport(retries=3): 1", unit: requests, denominator: "one GET /status/503", source: expected_output/07_errors.txt}
limitations:
  - Loopback only; seconds are machine-specific (Apple Silicon laptop); the ratios and connection counts are the claims.
  - Single hypercorn process; other servers change the HTTP/2 numbers.
  - httpx 1.0 tested as the 1.0.dev6 pre-release only.
  - No proxy was run (constructor calls only); 11_scrapingant.py skipped in the recorded run (no key).
claims:   # ids match briefs/requests-vs-httpx.ledger.md in seo_optimisation
  - "id": "C1"
    "text": "Versions: Python 3.12.11, requests 2.34.2, urllib3 2.8.0, httpx 0.28.1, httpcore 1.0.9, h2 4.4.1, anyio 4.15.1, hypercorn 0.18.0, OpenSSL 3.0.16 (Python's)"
    "type": "measured"
    "source": "00_versions.txt"
  - "id": "C2"
    "text": "Server: hypercorn ASGI app \"of under 100 lines\" (server.py is 97 lines), plain HTTP/1.1 on 127.0.0.1:8080, TLS with ALPN h2 + http/1.1 on localhost:8443, self-signed certificate from run.sh; endpoints and connection/request counters as listed"
    "type": "measured"
    "source": "server.py, run.sh"
  - "id": "C3"
    "text": "GET: response.url is str in requests and httpx.URL in httpx; r.ok vs r.is_success (AttributeError the other way); raise_for_status() returns None / Response; elapsed is timedelta in both; user agents python-requests/2.34.2 and python-httpx/0.28.1"
    "type": "measured"
    "source": "01_basics.txt"
  - "id": "C4"
    "text": "Bodies: form and json identical except httpx compact JSON since 0.28; data=bytes warns \"Use 'content=<...>' …\"; content= works"
    "type": "measured + documented"
    "source": "01_basics.txt; httpx CHANGELOG 0.28.0 \"JSON request bodies use a compact representation\" (accessed 2026-09-17)"
  - "id": "C5"
    "text": "Query params: requests drops None values, httpx sends them empty (a=&b=1); list of tuples works in both (guide says unsupported in httpx; 0.28.1 sends k=1&k=2); httpx .get() rejects json= with TypeError"
    "type": "measured + documented"
    "source": "01_basics.txt; https://www.python-httpx.org/compatibility/ \"Query Parameters\", \"Request body on HTTP methods\" (accessed 2026-09-17)"
  - "id": "C6"
    "text": "Redirects: requests follows by default (history [302, 302]); httpx returns 302 with next_request unless follow_redirects=True; allow_redirects=False in requests"
    "type": "measured + documented"
    "source": "02_defaults.txt; compatibility guide \"Redirects\""
  - "id": "C7"
    "text": "Timeouts: requests has none by default (200 after 6.0 s on /delay/6); httpx raises ReadTimeout after 5.0 s; default Timeout(5.0) covers connect/read/write/pool; timeout=None disables; requests takes a number or (connect, read) tuple"
    "type": "measured + documented"
    "source": "02_defaults.txt; https://www.python-httpx.org/advanced/timeouts/ (accessed 2026-09-17)"
  - "id": "C8"
    "text": "300 sequential GETs plain HTTP: requests.get 0.217 s/300 conns; Session 0.150 s/1; httpx.get 3.090 s/300; httpx.get verify=ctx 0.186 s; verify=False 0.237 s; Client 0.126 s/1. TLS: requests.get 0.785 s; Session 0.181 s; httpx.get verify=CERT 0.678 s; verify=ctx 0.621 s; Client 0.136 s"
    "type": "measured"
    "source": "03_pooling.txt"
  - "id": "C9"
    "text": "httpx.get() without a client costs ~10 ms per call even for http://: every HTTPTransport constructor calls create_ssl_context(), which loads the certifi bundle; urllib3 builds its context when an HTTPS connection is made, so requests pays nothing for plain HTTP"
    "type": "measured + documented"
    "source": "03_pooling.txt; httpx 0.28.1 `_transports/default.py` line 153 (`ssl_context = create_ssl_context(...)` in `HTTPTransport.__init__`) and `_config.py` `create_ssl_context` (`certifi.where()`); requests/urllib3: context created in `HTTPSConnection.connect` (urllib3 2.8.0)"
  - "id": "C10"
    "text": "httpx docs: create one client and pass it around; do not instantiate clients in a hot loop"
    "type": "documented"
    "source": "https://www.python-httpx.org/async/ \"Opening and closing clients\" warning (accessed 2026-09-17)"
  - "id": "C11"
    "text": "200 × /delay/0.05: sequential 10.422 s; Session + 20 threads 0.543 s, 32 conns, 68 \"pool is full\" log lines over 3 runs; pool_maxsize=20 → 0.541 s, 20 conns, 0 warnings; httpx.Client + 20 threads 0.545 s/20; AsyncClient Semaphore(20) 0.558 s/20; no semaphore 0.367 s/200; Limits(20,20) no semaphore 0.667 s/20; defaults Limits(100, 20, 5.0) and HTTPAdapter pool 10/10"
    "type": "measured"
    "source": "04_concurrency.txt"
  - "id": "C12"
    "text": "The default HTTPAdapter keeps 10 connections per host (pool_connections=pool_maxsize=10)"
    "type": "documented"
    "source": "requests 2.34.2 `adapters.py` line 80 `DEFAULT_POOLSIZE = 10`"
  - "id": "C13"
    "text": "requests speaks HTTP/1.1 only (raw.version = 11); urllib3 2.x HTTP/2 mode labelled experimental in its changelog; requests does not enable it"
    "type": "measured + documented"
    "source": "05_http2.txt; urllib3 CHANGES.rst 2.2.3 \"HTTP/2 (experimental) — HTTP/2 support is still in early development\" (accessed 2026-09-17)"
  - "id": "C14"
    "text": "httpx: http2=True opt-in, off by default; needs httpx[http2] (ImportError text quoted); ALPN over TLS, falls back to HTTP/1.1 on http://; response.http_version; GitHub Pages fixture answered HTTP/2"
    "type": "measured + documented"
    "source": "05_http2.txt; https://www.python-httpx.org/http2/ (accessed 2026-09-17)"
  - "id": "C15"
    "text": "HTTP/2 timings: Semaphore(20) 0.573 s/20 conns vs 0.599 s/1 conn; no semaphore 0.469 s/200 conns vs 0.170 s/1 conn; sequential 300: 0.115 s vs 0.125 s"
    "type": "measured"
    "source": "05_http2.txt"
  - "id": "C16"
    "text": "Streaming 50 MiB: requests buffered 0.038 s/148 MiB; streamed 0.020 s/35 MiB; httpx buffered 0.051 s/151 MiB; streamed 0.044 s/44 MiB; one process per case, median of 3"
    "type": "measured"
    "source": "06_streaming.txt, stream_cases.py"
  - "id": "C17"
    "text": "httpx stream() block closes the response on exit; iter_bytes vs iter_content"
    "type": "documented"
    "source": "compatibility guide \"Streaming responses\" (accessed 2026-09-17)"
  - "id": "C18"
    "text": "Exception classes for the five failures and base classes as printed; both raise_for_status errors carry .response"
    "type": "measured"
    "source": "07_errors.txt"
  - "id": "C19"
    "text": "Retries: urllib3 Retry(total=3, status_forcelist=[503]) → RetryError, server saw 4 requests; httpx HTTPTransport(retries=3) → 503, server saw 1 request; connection refused: httpx gave up after 1.5 s, requests Retry(backoff_factor=0.5) after 3.0 s"
    "type": "measured"
    "source": "07_errors.txt"
  - "id": "C20"
    "text": "httpx retries: \"retried the given number of times in case an httpx.ConnectError or an httpx.ConnectTimeout occurs … If you need other forms of retry behaviors, such as … reacting to 503 Service Unavailable, consider general-purpose tools such as tenacity\""
    "type": "documented"
    "source": "https://www.python-httpx.org/advanced/transports/ (accessed 2026-09-17)"
  - "id": "C21"
    "text": "Migration errors and warnings exactly as captured (allow_redirects, proxies, app TypeErrors; verify=str, data=bytes, per-request cookies DeprecationWarnings; cert= TypeError on httpx.get; reason/raw/iter_content AttributeErrors; elapsed RuntimeError inside stream)"
    "type": "measured"
    "source": "08_migration.txt"
  - "id": "C22"
    "text": "0.28.0 removed proxies= and app=; deprecated verify=str and cert="
    "type": "documented"
    "source": "httpx CHANGELOG 0.28.0 (accessed 2026-09-17)"
  - "id": "C23"
    "text": "Migration table rows not covered by C21: cert via ssl_context.load_cert_chain (0.28 SSL docs / the warning text); per-request cookies on a client; mounts scheme keys include `://`; r.iter_raw(); base exception classes"
    "type": "documented"
    "source": "compatibility guide sections \"Cookies\", \"Proxy keys\", \"Streaming responses\", \"Exceptions and Errors\"; 0.28.0 changelog SSL note (accessed 2026-09-17)"
  - "id": "C24"
    "text": "requests 2.34.2 released 2026-05-14, requires Python >=3.10; 2.34.0 (2026-05-11) added inline types replacing typeshed, Python 3.14t and 3.15 beta support"
    "type": "documented"
    "source": "PyPI JSON https://pypi.org/pypi/requests/json (`requires_python`, upload_time); requests HISTORY.md 2.34.0 (accessed 2026-09-17)"
  - "id": "C25"
    "text": "httpx 0.28.1 released 2024-12-06, requires Python >=3.8; 1.0.dev6 uploaded 2026-08-31"
    "type": "documented"
    "source": "PyPI JSON https://pypi.org/pypi/httpx/json (accessed 2026-09-17)"
  - "id": "C26"
    "text": "httpx 1.0 design proposal: \"A complete HTTP toolkit for Python. Supporting both client & server\", separate `ahttpx` package for async, \"The repository for this project is currently private\", \"This design work is not yet licensed for reuse\""
    "type": "documented"
    "source": "https://www.encode.io/httpnext/ (accessed 2026-09-17)"
  - "id": "C27"
    "text": "httpx 1.0.dev6 run: no top-level get/post/stream, no AsyncClient, no http2=, no Timeout, no HTTPTransport; Client().get() → 200 OK; 31 public names as listed"
    "type": "measured"
    "source": "09_httpx1_preview.txt"
  - "id": "C28"
    "text": "PyPI 30-day downloads (hugovk snapshot 2026-09-01, fetched 2026-09-17): requests rank 7 / 1,695,910,251; httpx 33 / 818,096,438; aiohttp 49 / 624,758,174; top 50 of 15,000"
    "type": "measured (fetched)"
    "source": "10_popularity.txt, expected_output/popularity.json"
  - "id": "C29"
    "text": "ScrapingAnt paragraph: registry wording verbatim for api.client_tls_scope, api.browser_false, api.credits_cost_header; 11_scrapingant.py skipped without a key (output quoted)"
    "type": "product + measured"
    "source": "registry keys; 11_scrapingant.txt"
  - "id": "C30"
    "text": "\"Sequential is about 20 times slower\": 10.422 / 0.541 = 19.3"
    "type": "measured"
