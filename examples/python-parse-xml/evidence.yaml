article_id: python-parse-xml
canonical_url: https://scrapingant.com/blog/python-parse-xml
owner: Oleg Kulyk
examples_repo_commit: "3bba034"
tested_at: 2026-09-16
requires_api_key: false
environment:
  os: macOS 26 (Darwin 25.6.0, arm64, Apple Silicon)
  python: "3.12.11"
  expat: "2.6.3"
  libxml2: "2.14.6"
dependencies:
  lxml: "6.1.3"
  beautifulsoup4: "4.15.0"
  untangle: "1.2.1"
  xmltodict: "1.0.4"
  defusedxml: "0.7.1"
  pandas: "3.0.5"
run_command: ./run.sh
fixtures:
  - fixtures/books.xml, books.xsd, books-invalid.xml, sitemap.xml, latin1.xml, broken.xml, billion-laughs.xml, xxe.xml, secret.txt
  - generated/large.xml (200,000 records, 23.8 MB) and generated/large2.xml (400,000 records, 47.7 MB), generated by 09_large_file.py
outputs:
  - expected_output/00_versions.txt … 10_security.txt (one file per script)
measurements:
  - name: large-file parse time and peak RSS per approach
    value: see expected_output/09_large_file.txt
    unit: seconds, MB
    denominator: 23.8 MB / 200,000 records (ten approaches) and 47.7 MB / 400,000 records (six approaches), one subprocess per approach, ru_maxrss
    source: expected_output/09_large_file.txt
limitations:
  - Timings and RSS are from one machine (see environment); ratios, not absolutes, are the claim.
  - The ScrapingAnt API is not called (no key).
  - xml.dom.pulldom and xmltodict streaming mode are not in the table.
claims:   # ids match briefs/python-parse-xml.ledger.md in seo_optimisation
  - "id": "C1"
    "text": "ElementTree basics: find/findall/findtext/iter/.get/.text, predicate path, missing element → None, fromstring from bytes and str; outputs quoted"
    "type": "measured"
    "source": "01_elementtree_basics.txt"
  - "id": "C2"
    "text": "Paths accept a limited XPath subset"
    "type": "documented"
    "source": "https://docs.python.org/3/library/xml.etree.elementtree.html#xpath-support (accessed 2026-09-16)"
  - "id": "C3"
    "text": "Latin-1 file with declaration parses from file/bytes; text mode with utf-8 → UnicodeDecodeError; lxml fromstring(str with declaration) → ValueError text quoted"
    "type": "measured"
    "source": "03_encodings.txt"
  - "id": "C4"
    "text": "Namespaced tag name is {uri}local; findall(\"url\") empty; three working forms; {*} since 3.8; prefixes in the map are the caller's; serialising without register_namespace gives ns0: (captured)"
    "type": "measured + documented"
    "source": "02_namespaces.txt (unregistered `tostring` line added after review); ET docs \"Parsing XML with Namespaces\" and `{*}` \"Changed in version 3.8\""
  - "id": "C5"
    "text": "ParseError (a SyntaxError subclass, issubclass captured) with .position; lxml XMLSyntaxError .lineno, error_log; recover=True output; missing file → FileNotFoundError"
    "type": "measured + documented"
    "source": "04_errors.txt; ET docs `xml.etree.ElementTree.ParseError` (`.position`)"
  - "id": "C6"
    "text": "iterparse yields elements at end events; clear pattern; lxml sibling-deletion loop from the lxml docs, whose rationale is that the while loop deletes siblings skipped by tag="
    "type": "documented"
    "source": "ET docs `iterparse`; https://lxml.de/parsing.html#modifying-the-tree (\"The while loop deletes multiple siblings in a row. This is only necessary if you skipped over some of them using the tag keyword argument.\"), accessed 2026-09-16"
  - "id": "C7"
    "text": "Measured tables: 23.8 MB / 200,000 records, ten approaches; 47.7 MB / 400,000 records, six approaches (both quoted in full); seconds and peak RSS MB as printed; each in its own subprocess"
    "type": "measured"
    "source": "09_large_file.txt"
  - "id": "C8"
    "text": "Readings: tree 10–16× file size (254 / 370 MB on 23.8 MB), minidom ≈30× (751), streaming 17–34 MB; ET.iterparse with only elem.clear() grows with the file (34 → 53 MB) because cleared stubs stay attached to the root; with root.clear() it stays at 17 MB; lxml.iterparse stays at 22 and sax at 23 MB; tree approaches double (254 → 491, 370 → 718); lxml fastest; bs4 and untangle slowest; bs4 and minidom largest"
    "type": "measured"
    "source": "09_large_file.txt (both tables)"
  - "id": "C9"
    "text": "xmltodict has a streaming mode (item_depth, item_callback)"
    "type": "documented"
    "source": "xmltodict README \"Streaming mode\" (accessed 2026-09-16)"
  - "id": "C10"
    "text": "Writing: set, .text, SubElement, remove, ET.indent (3.9+), write(xml_declaration=True), built sitemap; output quoted; CDATA re-serialised as escaped text"
    "type": "measured + documented"
    "source": "08_write_modify.txt; ET docs `indent` \"Added in version 3.9\""
  - "id": "C11"
    "text": "lxml XPath: predicates, count, sum, /@id, sourceline, namespaced XPath with prefix map; outputs quoted"
    "type": "measured"
    "source": "06_lxml.txt"
  - "id": "C12"
    "text": "XSD validation: XMLSchema.validate, error_log.filter_from_errors, XMLParser(schema=) raising XMLSyntaxError; pretty_print"
    "type": "measured"
    "source": "06_lxml.txt"
  - "id": "C13"
    "text": "xpath() returns floats for numeric functions; sum shows binary float (50.900000000000006)"
    "type": "measured"
    "source": "06_lxml.txt"
  - "id": "C14"
    "text": "minidom / sax / expat examples and outputs"
    "type": "measured"
    "source": "05_stdlib_others.txt"
  - "id": "C15"
    "text": "xmltodict (@attr, #text, unparse; no namespace processing by default, see C26), untangle (.cdata, attribute access), bs4 features=\"xml\" (find_all ignores namespaces, recovers broken), pandas.read_xml (xpath, namespaces, NaN) outputs quoted"
    "type": "measured"
    "source": "07_third_party.txt"
  - "id": "C16"
    "text": "bs4 features=\"xml\" uses lxml; pandas.read_xml parser default lxml; xmltodict force_list"
    "type": "documented"
    "source": "bs4 docs \"Parsing XML\"; pandas `read_xml` reference (`parser {'lxml','etree'}, default 'lxml'`); xmltodict README `force_list` (accessed 2026-09-16)"
  - "id": "C17"
    "text": "Python 3.12 docs table: expat ≥ 2.4.1 not vulnerable to billion laughs / quadratic blowup; modules listed vulnerable because of system expat; external entity expansion \"Safe\". Current (3.14) page: \"Expat versions lower than 2.7.2 may be vulnerable to the billion laughs, quadratic blowup and large tokens vulnerabilities, or to disproportional use of dynamic memory\"; tested expat 2.6.3 is below that threshold"
    "type": "documented"
    "source": "https://docs.python.org/3.12/library/xml.html#xml-vulnerabilities and https://docs.python.org/3/library/xml.html (3.14 wording), accessed 2026-09-16"
  - "id": "C18"
    "text": "Measured: ET rejects both files (messages quoted); lxml default rejects both; resolve_entities=True leaks secret.txt; resolve_entities=False → None; huge_tree=True still rejects; defusedxml EntitiesForbidden for both, parses books.xml; expat 2.6.3, libxml2 2.14.6"
    "type": "measured"
    "source": "10_security.txt"
  - "id": "C19"
    "text": "lxml default resolve_entities='internal' (since lxml 5)"
    "type": "documented"
    "source": "`lxml.etree.XMLParser` signature in 6.1.3 (`resolve_entities='internal'`); lxml CHANGES 5.0.0 (accessed 2026-09-16)"
  - "id": "C20"
    "text": "huge_tree lifts libxml2 size limits (documented); amplification limit still applied (measured)"
    "type": "documented + measured"
    "source": "lxml `XMLParser` docstring `huge_tree`; 10_security.txt"
  - "id": "C21"
    "text": "ScrapingAnt: browser=false wording verbatim from registry; ET.fromstring(response.content); docs link"
    "type": "product"
    "source": "registry `api.browser_false` (verified), `credits.simple_datacenter`"
  - "id": "C22"
    "text": "Versions as printed"
    "type": "measured"
    "source": "00_versions.txt"
  - "id": "C23"
    "text": "xml.etree.cElementTree is a deprecated alias since Python 3.3; xml.etree.ElementTree already uses the C accelerator"
    "type": "documented"
    "source": "ET docs: \"Deprecated since version 3.3: The xml.etree.cElementTree alias of this module is deprecated.\" (accessed 2026-09-16)"
  - "id": "C25"
    "text": "defusedxml refuses entity declarations by default (forbid_entities=True); only defusedxml.lxml and cElementTree are deprecated"
    "type": "documented"
    "source": "https://github.com/tiran/defusedxml/blob/main/README.md (accessed 2026-09-16)"
  - "id": "C26"
    "text": "xmltodict does no namespace processing by default (declarations treated as attributes; prefixed tags keep their prefix); process_namespaces=True to expand"
    "type": "documented"
    "source": "xmltodict README (accessed 2026-09-16)"
  - "id": "C24"
    "text": "Removed 2024 items: invented benchmark, codecs.open advice, \"Meta Description\" section, \"vulnerable by default\""
    "type": "n/a"
    "source": "previous article text"
