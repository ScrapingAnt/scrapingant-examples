article_id: python-parse-xml
canonical_url: https://scrapingant.com/blog/python-parse-xml
owner: Oleg Kulyk
examples_repo_commit: "d80f717"
tested_at: 2026-09-16
requires_api_key: false
environment:
  os: macOS 26 (Darwin 25.6.0, arm64, Apple Silicon)
  python: "3.12.11"
  expat: "2.6.3"
  libxml2: "2.14.6"
dependencies:
  lxml: "6.1.3"
  beautifulsoup4: "4.15.0"
  untangle: "1.2.1"
  xmltodict: "1.0.4"
  defusedxml: "0.7.1"
  pandas: "3.0.5"
run_command: ./run.sh
fixtures:
  - fixtures/books.xml, books.xsd, books-invalid.xml, sitemap.xml, latin1.xml, broken.xml, billion-laughs.xml, xxe.xml, secret.txt
  - generated/large.xml (200,000 records, 23.8 MB, generated by 09_large_file.py)
outputs:
  - expected_output/00_versions.txt … 10_security.txt (one file per script)
measurements:
  - name: large-file parse time and peak RSS per approach
    value: see expected_output/09_large_file.txt
    unit: seconds, MB
    denominator: 23.8 MB file, 200,000 <record> elements, one subprocess per approach, ru_maxrss
    source: expected_output/09_large_file.txt
limitations:
  - Timings and RSS are from one machine (see environment); ratios, not absolutes, are the claim.
  - The ScrapingAnt API is not called (no key).
  - xml.dom.pulldom and xmltodict streaming mode are not in the table.
claims:   # ids match briefs/python-parse-xml.ledger.md in seo_optimisation
  - "id": "C1"
    "text": "ElementTree basics: find/findall/findtext/iter/.get/.text, predicate path, missing element → None, fromstring from bytes and str; outputs quoted"
    "type": "measured"
    "source": "01_elementtree_basics.txt"
  - "id": "C2"
    "text": "Paths accept a limited XPath subset"
    "type": "documented"
    "source": "https://docs.python.org/3/library/xml.etree.elementtree.html#xpath-support (accessed 2026-09-16)"
  - "id": "C3"
    "text": "Latin-1 file with declaration parses from file/bytes; text mode with utf-8 → UnicodeDecodeError; lxml fromstring(str with declaration) → ValueError text quoted"
    "type": "measured"
    "source": "03_encodings.txt"
  - "id": "C4"
    "text": "Namespaced tag name is {uri}local; findall(\"url\") empty; three working forms; {*} since 3.8; prefixes in the map are the caller's; register_namespace affects output (else ns0)"
    "type": "measured + documented"
    "source": "02_namespaces.txt; ET docs \"Parsing XML with Namespaces\" and `{*}` \"Changed in version 3.8\""
  - "id": "C5"
    "text": "ParseError (a SyntaxError subclass) with .position; lxml XMLSyntaxError .lineno, error_log; recover=True output; missing file → FileNotFoundError"
    "type": "measured + documented"
    "source": "04_errors.txt; ET docs `xml.etree.ElementTree.ParseError`"
  - "id": "C6"
    "text": "iterparse yields elements at end events; clear pattern; lxml sibling-deletion pattern from the lxml docs"
    "type": "documented"
    "source": "ET docs `iterparse`; https://lxml.de/parsing.html#modifying-the-tree (accessed 2026-09-16)"
  - "id": "C7"
    "text": "Measured table: 23.8 MB, 200,000 records, nine approaches, seconds and peak RSS MB as printed; each in its own subprocess"
    "type": "measured"
    "source": "09_large_file.txt"
  - "id": "C8"
    "text": "Readings from the table: tree ≈10× file size (255/370 MB), minidom ≈30× (751), streaming flat 22–34 MB, lxml fastest, bs4/untangle slowest"
    "type": "measured"
    "source": "09_large_file.txt"
  - "id": "C9"
    "text": "xmltodict has a streaming mode (item_depth, item_callback)"
    "type": "documented"
    "source": "xmltodict README \"Streaming mode\" (accessed 2026-09-16)"
  - "id": "C10"
    "text": "Writing: set, .text, SubElement, remove, ET.indent (3.9+), write(xml_declaration=True), built sitemap; output quoted; CDATA re-serialised as escaped text"
    "type": "measured + documented"
    "source": "08_write_modify.txt; ET docs `indent` \"Added in version 3.9\""
  - "id": "C11"
    "text": "lxml XPath: predicates, count, sum, /@id, sourceline, namespaced XPath with prefix map; outputs quoted"
    "type": "measured"
    "source": "06_lxml.txt"
  - "id": "C12"
    "text": "XSD validation: XMLSchema.validate, error_log.filter_from_errors, XMLParser(schema=) raising XMLSyntaxError; pretty_print"
    "type": "measured"
    "source": "06_lxml.txt"
  - "id": "C13"
    "text": "xpath() returns floats for numeric functions; sum shows binary float (50.900000000000006)"
    "type": "measured"
    "source": "06_lxml.txt"
  - "id": "C14"
    "text": "minidom / sax / expat examples and outputs"
    "type": "measured"
    "source": "05_stdlib_others.txt"
  - "id": "C15"
    "text": "xmltodict (@attr, #text, unparse, namespaces stripped from view), untangle (.cdata, attribute access), bs4 features=\"xml\" (find_all ignores namespaces, recovers broken), pandas.read_xml (xpath, namespaces, NaN) outputs quoted"
    "type": "measured"
    "source": "07_third_party.txt"
  - "id": "C16"
    "text": "bs4 features=\"xml\" uses lxml; pandas.read_xml parser default lxml; xmltodict force_list"
    "type": "documented"
    "source": "bs4 docs \"Parsing XML\"; pandas `read_xml` reference (`parser {'lxml','etree'}, default 'lxml'`); xmltodict README `force_list` (accessed 2026-09-16)"
  - "id": "C17"
    "text": "Python docs table: expat ≥ 2.4.1 not vulnerable to billion laughs / quadratic blowup; modules listed vulnerable because of system expat; external entity expansion \"Safe\" for all listed modules"
    "type": "documented"
    "source": "https://docs.python.org/3/library/xml.html#xml-vulnerabilities (accessed 2026-09-16)"
  - "id": "C18"
    "text": "Measured: ET rejects both files (messages quoted); lxml default rejects both; resolve_entities=True leaks secret.txt; resolve_entities=False → None; huge_tree=True still rejects; defusedxml EntitiesForbidden for both, parses books.xml; expat 2.6.3, libxml2 2.14.6"
    "type": "measured"
    "source": "10_security.txt"
  - "id": "C19"
    "text": "lxml default resolve_entities='internal' (since lxml 5)"
    "type": "documented"
