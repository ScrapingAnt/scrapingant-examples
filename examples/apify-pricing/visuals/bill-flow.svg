<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1100" viewBox="0 0 700 1100" role="img" aria-labelledby="title desc">
<title id="title">Apify monthly charge reconciliation flow</title><desc id="desc">Identify event prices and run-usage inclusion; add post-run and other eligible usage; apply one allowance. Missing inputs prevent a precise bill. Free excess is infeasible. Paid cycle cost is plan fee plus next-invoice overage and known extra cash charges.</desc>
<style>text{font-family:Arial,sans-serif;fill:#142c43}.heading{font-weight:700}.muted{fill:#486477}.small{font-size:20px}</style>
<rect width="700" height="1100" fill="#f4f8fb"/><text x="32" y="50" font-size="29" class="heading">Reconcile a monthly Apify bill</text><text x="32" y="82" font-size="21" class="muted">Model scope: USD, known cycle totals</text><rect x="22" y="116" width="656" height="94" rx="12" fill="white" stroke="#bfd0dc"/><text x="40" y="151" font-size="23" class="heading">1  Confirm Actor prices and charged events</text><text x="40" y="183" font-size="20" class="">Record Actor/build, source date and event divisor.</text><path d="M350 214v20m-6-6 6 6 6-6" fill="none" stroke="#168c82" stroke-width="3"/><rect x="22" y="242" width="656" height="94" rx="12" fill="white" stroke="#bfd0dc"/><text x="40" y="277" font-size="23" class="heading">2  Determine Actor-run usage inclusion</text><text x="40" y="309" font-size="20" class="">Included → add $0. Extra / usage-only → add meters.</text><path d="M350 340v20m-6-6 6 6 6-6" fill="none" stroke="#168c82" stroke-width="3"/><rect x="22" y="368" width="656" height="94" rx="12" fill="white" stroke="#bfd0dc"/><text x="40" y="403" font-size="23" class="heading">3  Add post-run storage and transfer</text><text x="40" y="435" font-size="20" class="">Separate scope; billable in every charging model.</text><path d="M350 466v20m-6-6 6 6 6-6" fill="none" stroke="#168c82" stroke-width="3"/><rect x="22" y="494" width="656" height="94" rx="12" fill="white" stroke="#bfd0dc"/><text x="40" y="529" font-size="23" class="heading">4  Include other eligible account usage</text><text x="40" y="561" font-size="20" class="">Exclude these Actor scopes from that other total.</text><path d="M350 592v20m-6-6 6 6 6-6" fill="none" stroke="#168c82" stroke-width="3"/><rect x="22" y="620" width="656" height="94" rx="12" fill="white" stroke="#bfd0dc"/><text x="40" y="655" font-size="23" class="heading">5  Apply the account allowance once</text><text x="40" y="687" font-size="20" class="">Paid overage = max(eligible usage − allowance, 0).</text><path d="M350 718v20m-6-6 6 6 6-6" fill="none" stroke="#168c82" stroke-width="3"/><rect x="22" y="746" width="656" height="94" rx="12" fill="white" stroke="#bfd0dc"/><text x="40" y="781" font-size="23" class="heading">6  Check missing inputs and Free feasibility</text><text x="40" y="813" font-size="20" class="">Missing → partial. Above Free allowance → infeasible.</text><path d="M350 844v20m-6-6 6 6 6-6" fill="none" stroke="#168c82" stroke-width="3"/><rect x="22" y="872" width="656" height="94" rx="12" fill="white" stroke="#bfd0dc"/><text x="40" y="907" font-size="23" class="heading">7  Attribute cycle cash cost</text><text x="40" y="939" font-size="20" class="">Paid plan fee + overage + known extra cash charges.</text><text x="32" y="1036" font-size="22" class="heading">Overage is added to the next invoice.</text><text x="32" y="1070" font-size="20" class="muted">Rules checked 2026-10-02. Not an observed invoice.</text></svg>
