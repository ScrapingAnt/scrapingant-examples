article_id: wget-ignore-ssl
canonical_url: https://scrapingant.com/blog/wget-ignore-ssl
owner: Oleg Kulyk
examples_repo_commit: "7938f2d"
tested_at: 2026-09-16
requires_api_key: false
environment:
  os: macOS 26 (Darwin 25.6.0, arm64)
  wget: "GNU Wget 1.25.0 (Homebrew), +ssl/openssl"
  openssl_cli: "3.3.0"
  curl: "8.7.1"
  python3: "3.10.14 (server and certificate generation)"
dependencies:
  cryptography: "46.0.3"
run_command: ./run.sh
fixtures:
  - fixtures/index.html served at https://localhost:8443 (self-signed, SAN localhost) and https://localhost:8444 (expired: valid 2024-01-01 to 2024-02-01); certificates generated by gen_certs.py into certs/ (git-ignored)
outputs:
  - expected_output/00_versions.txt … 14_curl_equivalent.txt (one file per case)
measurements: []
limitations:
  - One TLS backend per run (OpenSSL here); case 07 (SSL_CERT_FILE) is backend-dependent and its check accepts either result; the CI run on Ubuntu (GnuTLS) records the other.
  - System-store update commands documented, not run; client certificates and CRLs out of scope.
claims:   # ids match briefs/wget-ignore-ssl.ledger.md in seo_optimisation
  - "id": "C1"
    "text": "Default fetch of a self-signed server: \"ERROR: cannot verify localhost's certificate … Self-signed certificate encountered.\" exit 5"
    "type": "measured"
    "source": "01_default.txt"
  - "id": "C2"
    "text": "Exit 5 = \"SSL verification failure\"; 4 network failure; 8 server error response"
    "type": "documented"
    "source": "GNU Wget manual, 2.13 Exit Status (accessed 2026-09-16)"
  - "id": "C3"
    "text": "--no-check-certificate downloads, prints the WARNING lines, exit 0"
    "type": "measured"
    "source": "02_no_check_certificate.txt"
  - "id": "C4"
    "text": "Manual: --no-check-certificate does not check against the CAs and does not require the host name to match"
    "type": "documented"
    "source": "GNU Wget manual, `--no-check-certificate` (accessed 2026-09-16)"
  - "id": "C5"
    "text": "--ca-certificate=certs/localhost.pem → page, no warning, exit 0"
    "type": "measured"
    "source": "03_ca_certificate.txt"
  - "id": "C6"
    "text": "--ca-certificate replaces the system bundle for that invocation (manual: \"Use file as the file with the bundle of certificate authorities\"; without it wget uses the system locations)"
    "type": "documented"
    "source": "GNU Wget manual, `--ca-certificate` (accessed 2026-09-16)"
  - "id": "C7"
    "text": "openssl rehash directory → --ca-directory works; hashed filename shown"
    "type": "measured"
    "source": "04_ca_directory.txt"
  - "id": "C8"
    "text": "Manual: --ca-directory expects the c_rehash layout; more efficient than a bundle because certificates are fetched on demand"
    "type": "documented"
    "source": "GNU Wget manual, `--ca-directory` (accessed 2026-09-16)"
  - "id": "C9"
    "text": "Same cert by IP: \"certificate common name 'localhost' doesn't match requested host name '127.0.0.1'\" exit 5"
    "type": "measured"
    "source": "05_ip_mismatch.txt"
  - "id": "C10"
    "text": "Expired cert with its own CA trusted: \"Issued certificate has expired.\" exit 5"
    "type": "measured"
    "source": "06_expired.txt"
  - "id": "C11"
    "text": ".wgetrc check_certificate = off via WGETRC → warning + download; -e check_certificate=off same"
    "type": "measured"
    "source": "08_wgetrc.txt, 09_execute_option.txt"
  - "id": "C12"
    "text": "Manual: check_certificate = on/off same as the option; ca_certificate = file, ca_directory = directory wgetrc commands; -e executes a wgetrc command"
    "type": "documented"
    "source": "GNU Wget manual, 6.3 Wgetrc Commands; `-e command` (accessed 2026-09-16)"
  - "id": "C13"
    "text": "SSL_CERT_FILE=certs/localhost.pem works on the OpenSSL build (+ssl/openssl)"
    "type": "measured"
    "source": "07_ssl_cert_file.txt, 00_versions.txt"
  - "id": "C14"
    "text": "SSL_CERT_FILE/SSL_CERT_DIR are OpenSSL's default-verify-path environment variables; the wget manual does not mention them"
    "type": "documented"
    "source": "https://docs.openssl.org/master/man3/SSL_CTX_set_default_verify_paths/ ; GNU Wget manual (no occurrence of SSL_CERT_FILE) (accessed 2026-09-16)"
  - "id": "C15"
    "text": "GnuTLS build (+ssl/gnutls) is what Debian and Ubuntu ship; the CI run on Ubuntu records the SSL_CERT_FILE case there"
    "type": "documented + measured (CI)"
    "source": "Debian package `wget` depends on `libgnutls30`; CI run log (linked in the README after the first run)"
  - "id": "C16"
    "text": "--pinnedpubkey with the right hash + --no-check-certificate → download; wrong hash → \"The public key does not match pinned public key!\" exit 5; pin alone without --no-check-certificate → verification error first"
    "type": "measured"
    "source": "10_pinnedpubkey_ok.txt, 11_pinnedpubkey_wrong.txt, 12_pinnedpubkey_with_verify.txt"
  - "id": "C17"
    "text": "Manual: --pinnedpubkey takes a key file or sha256// hashes and aborts before any data if the key does not match"
    "type": "documented"
    "source": "GNU Wget manual, `--pinnedpubkey` (accessed 2026-09-16)"
  - "id": "C18"
    "text": "--secure-protocol=TLSv1_2 fetch succeeds; manual's value list"
    "type": "measured + documented"
    "source": "13_secure_protocol.txt; manual `--secure-protocol`"
  - "id": "C19"
    "text": "--https-only applies to recursive mode only"
    "type": "documented"
    "source": "GNU Wget manual, `--https-only` (accessed 2026-09-16)"
  - "id": "C20"
    "text": "Stale store: ca-certificates / update-ca-certificates (Debian/Ubuntu), update-ca-trust (RHEL family)"
    "type": "documented"
    "source": "Debian ca-certificates package (update-ca-certificates(8)); RHEL update-ca-trust(8) (accessed 2026-09-16)"
  - "id": "C21"
    "text": "Manual: without --ca-certificate wget looks at the system-specified locations chosen at OpenSSL installation time"
    "type": "documented"
    "source": "GNU Wget manual, `--ca-certificate` (accessed 2026-09-16)"
  - "id": "C22"
    "text": "curl: default fails with \"(60) SSL certificate problem: self signed certificate\"; -k and --cacert succeed"
    "type": "measured"
    "source": "14_curl_equivalent.txt"
  - "id": "C23"
    "text": "ScrapingAnt: registry wording verbatim"
    "type": "product"
    "source": "registry `api.client_tls_scope`"
  - "id": "C24"
    "text": "Versions: GNU Wget 1.25.0 built on darwin24.1.0, +ssl/openssl; OpenSSL 3.3.0; curl 8.7.1"
    "type": "measured"
    "source": "00_versions.txt"
