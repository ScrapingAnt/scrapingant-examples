article_id: wget-ignore-ssl
canonical_url: https://scrapingant.com/blog/wget-ignore-ssl
owner: Oleg Kulyk
examples_repo_commit: "<filled after commit>"
tested_at: 2026-09-16
requires_api_key: false
environment:
  os: macOS 26 (Darwin 25.6.0, arm64)
  wget: "GNU Wget 1.25.0 (Homebrew), +ssl/openssl, links /opt/homebrew/opt/openssl@3/lib/libssl.3.dylib"
  wget_gnutls_container: "Debian 12 (bookworm) GNU Wget 1.21.3, +ssl/gnutls (run-gnutls-docker.sh, Docker 29.4)"
  openssl_cli: "3.3.0 (PATH; used for rehash and the pin only, not wget's TLS)"
  curl: "8.7.1"
  python3: "3.12.11 (.venv; server and certificate generation)"
dependencies:
  cryptography: "46.0.3"
run_command: ./run.sh
fixtures:
  - fixtures/index.html served at https://localhost:8443 (self-signed, SAN localhost), :8444 (expired: valid 2024-01-01 to 2024-02-01) and :8445 (leaf issued by a generated Example Internal CA); certificates generated by gen_certs.py into certs/ (git-ignored)
  - https://scrapingant.github.io/scrapingant-examples/fixtures/dynamic-delayed.html (public site, case 03b)
outputs:
  - expected_output/00_versions.txt … 14_curl_equivalent.txt (one file per case, incl. 03b/03c/03d/06b)
  - expected_output/gnutls/ (00, 01, 02, 03, 07 from the Debian container)
measurements: []
limitations:
  - run.sh records one build (OpenSSL); the GnuTLS run needs Docker and is refreshed by hand (Ubuntu CI is also an OpenSSL build).
  - System-store update commands documented, not run; client certificates and CRLs out of scope.
claims:   # ids match briefs/wget-ignore-ssl.ledger.md in seo_optimisation
  - "id": "C1"
    "text": "Default fetch of a self-signed server: \"ERROR: cannot verify localhost's certificate … Self-signed certificate encountered.\" exit 5"
    "type": "measured"
    "source": "01_default.txt"
  - "id": "C2"
    "text": "Exit 5 = \"SSL verification failure\"; 4 network failure; 8 server error response"
    "type": "documented"
    "source": "GNU Wget manual, 2.13 Exit Status (accessed 2026-09-16)"
  - "id": "C3"
    "text": "--no-check-certificate downloads, prints the WARNING lines, exit 0"
    "type": "measured"
    "source": "02_no_check_certificate.txt"
  - "id": "C4"
    "text": "Manual: --no-check-certificate does not check against the CAs and does not require the host name to match"
    "type": "documented"
    "source": "GNU Wget manual, `--no-check-certificate` (accessed 2026-09-16)"
  - "id": "C5"
    "text": "--ca-certificate=certs/localhost.pem → page, no warning, exit 0"
    "type": "measured"
    "source": "03_ca_certificate.txt"
  - "id": "C6"
    "text": "--ca-certificate adds to the system store: with only certs/localhost.pem given, a public site (the GitHub Pages fixture) still verifies, exit 0; contrast with requests' verify=<path> (replaces)"
    "type": "measured + documented"
    "source": "03b_ca_certificate_public.txt; wget 1.25.0 `src/openssl.c` (`SSL_CTX_set_default_verify_paths` then `SSL_CTX_load_verify_locations`); requests-ignore-ssl ledger C9"
  - "id": "C7"
    "text": "openssl rehash directory → --ca-directory works; hashed filename shown"
    "type": "measured"
    "source": "04_ca_directory.txt"
  - "id": "C8"
    "text": "Manual: --ca-directory expects the c_rehash layout; more efficient than a bundle because certificates are fetched on demand"
    "type": "documented"
    "source": "GNU Wget manual, `--ca-directory` (accessed 2026-09-16)"
  - "id": "C9a"
    "text": "Internal CA: default fetch of :8445 → \"issued by 'CN=Example Internal CA': Unable to locally verify the issuer's authority.\" exit 5; --ca-certificate=certs/ca.pem → page, exit 0"
    "type": "measured"
    "source": "03c_internal_ca_default.txt, 03d_internal_ca_trusted.txt"
  - "id": "C9"
    "text": "Same cert by IP: \"certificate common name 'localhost' doesn't match requested host name '127.0.0.1'\" exit 5"
    "type": "measured"
    "source": "05_ip_mismatch.txt"
  - "id": "C10"
    "text": "Expired cert with its own CA trusted: \"Issued certificate has expired.\" exit 5; with --no-check-certificate the fetch succeeds and the warning is the self-signed one (the expired cert is also self-signed)"
    "type": "measured"
    "source": "06_expired.txt, 06b_expired_no_check.txt"
  - "id": "C11"
    "text": ".wgetrc check_certificate = off via WGETRC → warning + download; -e check_certificate=off same"
    "type": "measured"
    "source": "08_wgetrc.txt, 09_execute_option.txt"
  - "id": "C12"
    "text": "Manual: check_certificate = on/off same as the option; ca_certificate = file, ca_directory = directory wgetrc commands; -e executes a wgetrc command"
    "type": "documented"
    "source": "GNU Wget manual, 6.3 Wgetrc Commands; `-e command` (accessed 2026-09-16)"
  - "id": "C13"
    "text": "SSL_CERT_FILE=certs/localhost.pem works on the OpenSSL build (+ssl/openssl); on Debian 12's GnuTLS build (wget 1.21.3, +ssl/gnutls, links libgnutls.so.30) the same variable is ignored and the fetch fails as with no variable; --ca-certificate works on both; GnuTLS error wording quoted"
    "type": "measured"
    "source": "07_ssl_cert_file.txt, 00_versions.txt; gnutls/00_versions.txt, gnutls/01_default.txt, gnutls/02_no_check_certificate.txt, gnutls/03_ca_certificate.txt, gnutls/07_ssl_cert_file.txt"
  - "id": "C14"
    "text": "SSL_CERT_FILE/SSL_CERT_DIR are OpenSSL's default-verify-path environment variables; the wget manual does not mention them"
    "type": "documented"
    "source": "https://docs.openssl.org/master/man3/SSL_CTX_set_default_verify_paths/ ; GNU Wget manual (no occurrence of SSL_CERT_FILE) (accessed 2026-09-16)"
  - "id": "C15"
    "text": "Debian's wget package links GnuTLS (libgnutls30, measured in the container: +ssl/gnutls); Ubuntu's package is built with OpenSSL (depends on libssl3 / libssl3t64; changelog: --with-ssl=openssl)"
    "type": "measured + documented"
    "source": "gnutls/00_versions.txt; https://packages.ubuntu.com/noble/wget and https://packages.debian.org/bookworm/wget (accessed 2026-09-16)"
  - "id": "C16"
    "text": "--pinnedpubkey with the right hash + --no-check-certificate → download; wrong hash → \"The public key does not match pinned public key!\" exit 5; pin alone without --no-check-certificate → verification error first"
    "type": "measured"
    "source": "10_pinnedpubkey_ok.txt, 11_pinnedpubkey_wrong.txt, 12_pinnedpubkey_with_verify.txt"
  - "id": "C17"
    "text": "Manual: --pinnedpubkey takes a key file or sha256// hashes and aborts before any data if the key does not match"
    "type": "documented"
    "source": "GNU Wget manual, `--pinnedpubkey` (accessed 2026-09-16)"
  - "id": "C18"
    "text": "--secure-protocol=TLSv1_2 fetch succeeds; manual's full value list (auto, SSLv2, SSLv3, TLSv1, TLSv1_1, TLSv1_2, TLSv1_3, PFS)"
    "type": "measured + documented"
    "source": "13_secure_protocol.txt; manual `--secure-protocol`"
  - "id": "C19"
    "text": "--https-only applies to recursive mode only"
    "type": "documented"
    "source": "GNU Wget manual, `--https-only` (accessed 2026-09-16)"
  - "id": "C20"
    "text": "Stale store: ca-certificates / update-ca-certificates (Debian/Ubuntu), update-ca-trust (RHEL family)"
    "type": "documented"
    "source": "Debian ca-certificates package (update-ca-certificates(8)); RHEL update-ca-trust(8) (accessed 2026-09-16)"
  - "id": "C21"
    "text": "Manual: without --ca-certificate or --ca-directory wget looks at the system-specified locations chosen at OpenSSL installation time; stale-store diagnosis worded \"probably\", with proxy CA and clock as the other causes"
