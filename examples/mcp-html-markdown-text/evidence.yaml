limitations:
- Local browser selection is a source-informed reference, not hosted MCP text output
  or raw-mode verification.
- Selected fixtures; five deterministic repeats are not model trials or independent
  sites.
- Lexical presence is not correct row association; duplicate values count as separate
  field slots.
- Same AI session authored local fixtures and oracle; fresh independent review required.
- URL-presence fallback checks pathname only; selected purchase URLs have no query
  or fragment. Extend and test before expanding that scope.
- ASCII-only selected inputs; no Unicode payload generalization.
- Content-only token counts exclude prompt, schema, tools and billing overhead.
- Public schemas do not verify retrieval behavior or production reliability.
- Named author review, source merge and deployment remain unapproved.
- 'Hosted raw-mode text differs from local browser selection: title/hidden stock row/newline
  cell layout are retained.'
- 15 live acquisition calls target one static URL; Markdown/text source identity is
  not exposed.
- Scoped account deltas are contemporaneous, not exclusive request receipts; concurrent
  traffic cannot be ruled out.
- Two pre-inference model failures; no accuracy, reported usage, actual total charges,
  uncertainty interval or cost per correct output exists. Reservations are allowance
  accounting, not billing.
