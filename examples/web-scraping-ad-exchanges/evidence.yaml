  "claims": [
    {
      "id": "C1",
      "text": "ads.txt declares advertising-system domain, account ID and DIRECT/RESELLER account-control relationship.",
      "type": "external",
      "source": "ads_spec"
    },
    {
      "id": "C2",
      "text": "sellers.json resolves seller IDs to identity records; seller type is separate from ads.txt account control.",
      "type": "external",
      "source": "sellers_spec"
    },
    {
      "id": "C3",
      "text": "Confidential records still contain IDs and types, while name/domain can be omitted; seller IDs are strings.",
      "type": "external",
      "source": "sellers_spec"
    },
    {
      "id": "C4",
      "text": "Business and inventory domains can differ; a domain difference alone is not an error in this checker.",
      "type": "external",
      "source": "guidance"
    },
    {
      "id": "C5",
      "text": "SupplyChain describes a particular bid request; these static files alone do not reconstruct transactions.",
      "type": "external",
      "source": "supplychain"
    },
    {
      "id": "C6",
      "text": "The run matched 16/16 hand-authored classifications and rejected 5/5 malformed-input regressions.",
      "type": "measured",
      "source": "expected_output/verification.txt"
    },
    {
      "id": "C7",
      "text": "16 data rows yielded 13 unique valid join candidates, 2 invalid rows and 1 duplicate; 2 variables were separate.",
