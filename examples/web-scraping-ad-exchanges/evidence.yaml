    {
      "name": "valid unique join candidates",
      "value": 13,
      "unit": "rows",
      "denominator": 16,
      "source": "expected_output/report.json"
    },
    {
      "name": "uncheckable candidates",
      "value": 6,
      "unit": "rows",
      "denominator": 13,
      "source": "expected_output/report.json"
    },
    {
      "name": "network requests during executable run",
      "value": 0,
      "unit": "requests",
      "denominator": "one offline run",
      "source": "expected_output/run-meta.json"
    },
    {
      "name": "unavailable sellers inputs",
      "value": 1,
      "unit": "mapped inputs",
      "denominator": 6,
      "source": "expected_output/report.json"
    }
  ],
  "limitations": [
    "Owned synthetic complete fixtures only; not industry measurements or live advertising data.",
    "Diagnostic ads subset deliberately continues past malformed rows; no overall file authorization decision.",
    "Strict sellers.json 1.0 integer confidentiality; booleans or strings are uncheckable.",
    "No HTTP, freshness/completeness validation, recursive discovery, PSL validation, variables interpretation, extensions or SupplyChain validation.",
    "No fraud, legality, bids, users, ads served, performance or payment-path inference.",
    "Public domain is optional for sellers lacking web presence; this checker cannot determine actual web presence.",
    "Spec research requests were separate from the zero-network fixture run."
  ],
