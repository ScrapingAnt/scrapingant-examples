# Evidence manifest for https://scrapingant.com/blog/pandas-read-html-table
article_id: pandas-read-html-table
canonical_url: https://scrapingant.com/blog/pandas-read-html-table
owner: Oleg Kulyk
examples_repo_commit: "57ae6b0"
tested_at: 2026-09-17
requires_api_key: false   # 10_scrapingant.py runs only when SCRAPINGANT_API_KEY is set and prints "skipped" otherwise
environment:
  os: macOS 26 (Darwin 25.6.0, arm64, Apple Silicon)
  python: "3.12.11 (.venv)"
  libxml2: "2.14.6"
dependencies:
  pandas: "3.0.5"
  numpy: "2.5.3"
  lxml: "6.1.3"
  beautifulsoup4: "4.15.0"
  html5lib: "1.1"
  requests: "2.34.2"
run_command: ./run.sh
fixtures:
  - fixtures/tables.html (eleven tables; copy served at https://scrapingant.github.io/scrapingant-examples/fixtures/html-tables.html)
  - fixtures/broken.html, fixtures/no-tables.html
  - https://en.wikipedia.org/wiki/List_of_countries_and_dependencies_by_population (08, two requests)
outputs:
  - expected_output/00_versions.txt … 10_scrapingant.txt (one file per script)
measurements:
  - {name: parser_time_20k_rows, value: "lxml 1.27 s median (min 1.20) vs bs4 17.19 s (min 15.83)", unit: s, denominator: "20,000 rows x 6 cols, 1.9 MB HTML, median of 5", source: expected_output/07_parsers.txt}
  - {name: wikipedia_default_user_agent, value: "HTTP 403 with pandas' default UA; (241, 6) with storage_options User-Agent", unit: status, denominator: "one page, 2026-09-17", source: expected_output/08_http.txt}
limitations:
  - Wikipedia's response to the default user agent is dated; it is their policy and can change.
  - Parser seconds are machine-specific; the lxml/bs4 ratio is the claim.
  - pandas 2.x behaviour (FutureWarning on raw strings) is documented, not run.
  - 10_scrapingant.py skipped in the recorded run (no key).
claims:   # ids match briefs/pandas-read-html-table.ledger.md in seo_optimisation
  - "id": "C1"
    "text": "Versions: Python 3.12.11, pandas 3.0.5, numpy 2.5.3, lxml 6.1.3, beautifulsoup4 4.15.0, html5lib 1.1, requests 2.34.2, libxml2 2.14.6"
    "type": "measured"
    "source": "00_versions.txt"
  - "id": "C2"
    "text": "The fixture has eleven `<table>` elements; `read_html` returns twelve DataFrames because the nested table counts as its own; shapes as printed"
    "type": "measured"
    "source": "fixtures/tables.html; 01_basics.txt"
  - "id": "C3"
    "text": "A raw HTML string is treated as a path on pandas 3 (`FileNotFoundError: [Errno 2] No such file or directory: <!DOCTYPE html>`); `StringIO`, a binary file object and a URL work; pandas 2.1 deprecated literal strings and 3.0 removed the support"
    "type": "measured + documented"
    "source": "01_basics.txt, 08_http.txt; whatsnew 2.1.0 \"Deprecated literal string/bytes input to read_html() … Wrap … in io.StringIO / io.BytesIO instead (GH 53767)\"; whatsnew 3.0.0 \"read_excel(), read_json(), read_html(), and read_xml() no longer accept raw string or byte representation of the data\" (accessed 2026-09-17)"
  - "id": "C4"
    "text": "`read_html` needs lxml, or beautifulsoup4 plus html5lib; `flavor` values `lxml`, `html5lib`, `bs4` (last two synonymous); default None tries lxml then falls back on bs4 + html5lib; the article recommends installing all three, as the IO guide does (\"highly recommended that you install both BeautifulSoup4 and html5lib, so that you will still get a valid result … even if lxml fails\")"
    "type": "documented"
    "source": "pandas reference `pandas.read_html`, `flavor`; IO guide \"HTML Table Parsing Gotchas\" (accessed 2026-09-17)"
  - "id": "C5"
    "text": "`match` default `.+` matches any non-empty table; it is tested per text node inside the table (`\"Ant Farm\"` returns both the prices and links tables; the anchored `^Q[1-4]$` matches a cell); `attrs` filters on `<table>` attributes; they combine; no match → `ValueError: No tables found matching pattern '…'` / `ValueError: No tables found` (\"rare exceptions\" per the reference); a header-only table with an empty `<tbody>` returns a (0, 2) DataFrame with the column names; a pattern spanning two cells (`\"Ant Farm Deluxe manual\"`) finds nothing; lxml's message is \"matching regex\", bs4's \"matching pattern\"; with default flavor the no-match ValueError from lxml triggers the bs4 fallback (second parse with html5lib), and with bs4 missing that is `ImportError: Import beautifulsoup4 failed`"
    "type": "measured + documented"
    "source": "02_select.txt; pandas 3.0.5 `io/html.py` (bs4 `table.find(string=match)`, lxml `//table[.//text()[re:test(., pattern)]]`); reference `match`, `attrs`; Notes \"This function will always return a list of DataFrame or it will fail … save for some rare cases\""
  - "id": "C6"
    "text": "`<thead>` rows (or, with no `<thead>`, the top `<th>`-only rows) become the column index; two header rows → MultiIndex; `colspan`/`rowspan` in the header expanded, the `rowspan=\"2\"` cell repeated at both levels; flattening by joining levels; `header=1` keeps the second row and de-duplicates with `.1`"
    "type": "measured + documented"
    "source": "03_headers.txt; reference Notes (\"If the function has a `<thead>` argument, it is used to construct the header, otherwise … rows with only `<th>` elements into the header\"; \"attempts to properly handle colspan and rowspan\")"
  - "id": "C7"
    "text": "Body spans expanded (\"Tools\" repeated, \"sold out\" fills both cells); `<td>` first row → integer column names until `header=0`; `header=None` on a `<th>` table changes nothing; `index_col=0`; `skiprows=1` skips the header row and promotes \"Ada\" on `simple`, and does the same on `prices`, which has a `<thead>` (captured); `skiprows=[1]` drops row 1; header applied after skiprows"
    "type": "measured + documented"
    "source": "03_headers.txt; reference Notes \"Similar to read_csv() the header argument is applied after skiprows is applied\""
  - "id": "C8"
    "text": "`thousands=\",\"` default: `12,345` → int64 12345; `$1,234.50` and `45.5%` stay `str`; `thousands=None` keeps all as str; `converters` receive each cell's text and replace type inference for that column (identity converter leaves `Code` as `str`; prices cleaned to float64)"
    "type": "measured + documented"
    "source": "04_numbers.txt; reference `thousands` \"Defaults to ','\", `converters` \"functions that take one input argument, the cell (not column) content\""
  - "id": "C9"
    "text": "Leading zeros lost (`007` → 7, `01234` → 1234); `converters={\"Code\": str}` keeps them"
    "type": "measured"
    "source": "04_numbers.txt"
  - "id": "C10"
    "text": "European formatting with default `thousands=\",\"`: `3,5` → 35, `-1,2` → -12 (silently wrong numbers); `thousands=\".\", decimal=\",\"` → 3.5, -1.2, 1234567.89"
    "type": "measured"
    "source": "04_numbers.txt"
  - "id": "C11"
    "text": "`n/a` → NaN without options (default NA list); `keep_default_na=False` alone keeps the string `n/a` (captured); `na_values` appends, and replaces when combined with `keep_default_na=False`"
    "type": "measured + documented"
    "source": "04_numbers.txt; reference `keep_default_na` \"If na_values are specified and keep_default_na is False the default NaN values are overridden, otherwise they're appended to\""
  - "id": "C12"
    "text": "`parse_dates=True` left the date columns as `str` (it targets the index, read_csv semantics); `parse_dates=[\"Shipped\"]` → datetime64[us]; `index_col=0, parse_dates=True` → DatetimeIndex; `pd.to_datetime` after reading; `dtype_backend=\"numpy_nullable\"` gives `string` / `Int64`"
    "type": "measured + documented"
    "source": "04_numbers.txt; reference `parse_dates` \"See read_csv() for more details\""
  - "id": "C13"
    "text": "`extract_links` values `None`, `all`, `header`, `body`, `footer`; cells become (text, href) tuples with None where no link; with `all` the column labels are tuples; `df[(\"Docs\", None)].str[1]`"
    "type": "measured + documented"
    "source": "05_links.txt; reference `extract_links`"
  - "id": "C14"
    "text": "`displayed_only=True` default drops elements whose inline `style` contains `display:none` and nothing else: class + stylesheet, `hidden` attribute, `visibility:hidden` and `DISPLAY: NONE` rows are kept with both parsers (captured); `False` keeps the inline-hidden row"
    "type": "measured + documented"
    "source": "06_hidden_nested.txt; reference `displayed_only`; pandas 3.0.5 `io/html.py` (`\"display:none\" not in … .get(\"style\", \"\").replace(\" \", \"\")`)"
  - "id": "C15"
    "text": "A nested table is returned twice: as its own DataFrame and flattened into the outer table's cell (text concatenated \"BinCount B140 B215\", rows spilling into extra outer rows) because both parsers collect every descendant `<tr>`"
    "type": "measured + documented"
    "source": "06_hidden_nested.txt; pandas 3.0.5 `io/html.py` (`table.xpath(\".//tbody//tr\")`, `table.select(\"tbody tr\")`)"
  - "id": "C16"
    "text": "On the broken fixture all three flavors produced the same (3, 2) DataFrame; the IO guide warns lxml \"does not make any guarantees about the results of its parse unless it is given strictly valid markup\" and that the lxml backend \"will use html5lib if lxml fails to parse\"; in the code the next flavor is tried only on `ValueError`"
    "type": "measured + documented"
    "source": "07_parsers.txt; IO guide \"HTML Table Parsing Gotchas\" (accessed 2026-09-17); pandas 3.0.5 `io/html.py` `_parse` (retry on ValueError)"
  - "id": "C17"
    "text": "Missing-library ImportError texts as captured (lxml, beautifulsoup4, html5lib)"
    "type": "measured"
    "source": "07_parsers.txt (subprocess with the module blocked)"
  - "id": "C18"
    "text": "20,000 × 6 generated table, 1.9 MB: lxml median 1.27 s (min 1.20), bs4 median 17.19 s (min 15.83), same shape and dtypes; \"about 13 times faster\" = 17.19 / 1.27 = 13.5"
    "type": "measured"
    "source": "07_parsers.txt"
  - "id": "C19"
    "text": "`pd.read_html(WIKI, match=\"Population\")` with pandas' default user agent → `urllib.error.HTTPError: HTTP Error 403: Forbidden` on 2026-09-17; with `storage_options=UA` → (241, 6), the first table containing \"Population\""
    "type": "measured"
    "source": "08_http.txt (WIKI and UA defined at lines 8–9)"
  - "id": "C20"
    "text": "`storage_options` added in 2.1.0; for HTTP(S) URLs the key-value pairs are forwarded to `urllib.request.Request` as headers"
    "type": "documented"
    "source": "reference `storage_options` \"Added in version 2.1.0\"; whatsnew 2.1.0 \"read_html() now supports the storage_options keyword when used with a URL, allowing users to add headers\" (accessed 2026-09-17)"
  - "id": "C21"
    "text": "`requests.get` + `StringIO(r.text)` → 12 tables; `pd.read_html(r.text)` and `pd.read_html(str(target))` raise FileNotFoundError; `StringIO(str(target))` works; rows by hand shown"
    "type": "measured"
    "source": "08_http.txt"
  - "id": "C22"
    "text": "`DataFrame.append` removed in pandas 2.0 (AttributeError captured); `chunksize=` and `usecols=` → TypeError (not `read_html` parameters; they are `read_csv` parameters); positional `match` → TypeError (keyword-only after `io` since pandas 2.0: whatsnew 2.0.0 \"Disallow passing non-keyword arguments to read_html() except for io (GH 27573)\"; not an old-page idiom, stated as such); `table('simple', header=5)` → ValueError text; the old page's idioms were raw strings, `str(target_table)`, `df.append`, `usecols`, `chunksize`"
    "type": "measured + documented"
    "source": "09_old_page_errors.txt; whatsnew 2.0.0 \"Removed deprecated Series.append(), DataFrame.append(), use concat() instead (GH 35407)\"; `read_html` signature `(io, *, match=…)`; `read_csv` reference for `chunksize`/`usecols` (accessed 2026-09-17)"
  - "id": "C23"
    "text": "ScrapingAnt paragraph: registry wording verbatim for `credits.browser_js_datacenter` and `api.browser_false`; `10_scrapingant.py` skipped without a key (output quoted); \"when the table is in the HTML the server sends … no rendering service is needed\""
    "type": "product + measured"
    "source": "registry keys; 10_scrapingant.txt"
  - "id": "C24"
    "text": "On pandas 2.1 to 2.3 the raw-string form still works with a `FutureWarning`"
    "type": "documented"
    "source": "whatsnew 2.1.0 deprecation entry (deprecations in pandas 2.x raise FutureWarning); not run on 2.x"
  - "id": "C25"
    "text": "pandas 3.0.5 released 2026-07-22, requires Python ≥3.11"
    "type": "documented"
    "source": "https://pypi.org/pypi/pandas/json (accessed 2026-09-17)"
  - "id": "C26"
    "text": "The snippets' assumed names and imports are verbatim packet lines: `re`, `StringIO`, `pandas`, `requests`, `BeautifulSoup` imports; `PAGE`, `URL` (`_common.py`); `WIKI`, `UA` (`08_http.py` lines 8–9); `KEY`, `TARGET` described in prose (`10_scrapingant.py`)"
    "type": "measured"
    "source": "packet scripts"
  - "id": "C27"
    "text": "`header=None` is the default (\"infer\"); no option keeps a `<th>` row as data; the 2024 page's `header=None  # Don't use any row as header` was wrong"
    "type": "measured + documented"
    "source": "03_headers.txt (header=None identical to default); `inspect.signature(pd.read_html)` default `header=None`; reference `header`"
  - "id": "C28"
    "text": "The `show()` helper truncates exception messages to the first line; the FileNotFoundError message really contains the whole HTML"
    "type": "measured"
    "source": "_common.py"
