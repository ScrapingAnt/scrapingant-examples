article_id: beautifulsoup-cheatsheet
canonical_url: https://scrapingant.com/blog/beautifulsoup-cheatsheet
owner: Oleg Kulyk
examples_repo_commit: "<filled after commit>"
tested_at: 2026-09-17
requires_api_key: false
environment:
  os: macOS 26 (Darwin 25.6.0, arm64, Apple Silicon)
  python: "3.12.11 (.venv)"
  libxml2: "2.14.6"
dependencies:
  beautifulsoup4: "4.15.0"
  lxml: "6.1.3"
  html5lib: "1.1"
  soupsieve: "2.9.2"
  requests: "2.34.2"
  pandas: "3.0.5"
run_command: ./run.sh   # REFRESH_POPULARITY=1 ./run.sh re-fetches the popularity snapshot
fixtures:
  - fixtures/page.html (catalogue page), fixtures/broken.html (misnested fragment)
  - generated/large.html (20,000 products, 3.1 MB, generated by 12_speed.py)
  - https://scrapingant.github.io/scrapingant-examples/fixtures/dynamic-delayed.html (case 01, requests)
outputs:
  - expected_output/00_versions.txt … 12_speed.txt (one file per script)
  - expected_output/popularity.json, popularity.txt (dated snapshot, kept across runs)
measurements:
  - name: parse + collect p.price, CPU seconds
    value: see expected_output/12_speed.txt
    unit: CPU seconds (best of 5)
    denominator: 3.1 MB, 20,000 <div class="product"> cards, one subprocess per case
    source: expected_output/12_speed.txt
  - name: PyPI 30-day downloads and rank; Stack Overflow tag counts
    value: see expected_output/popularity.json
    unit: downloads / questions
    denominator: hugovk top-pypi-packages snapshot 2026-09-01 (15,000 packages); Stack Exchange API 2026-09-17
    source: expected_output/popularity.json
limitations:
  - One fixture page; parser differences shown are those the broken fragment provokes.
  - CPU seconds are machine-specific; ratios are the claim.
  - Popularity is a dated snapshot.
  - ScrapingAnt endpoints documented, not run.
claims:   # ids match briefs/beautifulsoup-cheatsheet.ledger.md in seo_optimisation
  - "id": "C1"
    "text": "Parse from str, file object (bytes; original_encoding utf-8), requests response (r.content); Latin-1 bytes guessed and told; outputs quoted"
    "type": "measured"
    "source": "01_parse.txt"
  - "id": "C2"
    "text": "from_encoding on a str is ignored with a UserWarning; a filename passed as markup raises MarkupResemblesLocatorWarning"
    "type": "measured"
    "source": "01_parse.txt"
  - "id": "C3"
    "text": "Same broken fragment gives three trees (html.parser nests the second <p>; lxml closes it and adds html/body; html5lib re-opens <i>); diagnose() prints all three"
    "type": "measured"
    "source": "02_parsers.txt"
  - "id": "C4"
    "text": "Speed table (3.1 MB, 20,000 products, CPU seconds best of 5, subprocess per case): values as recorded; lxml fastest builder, html5lib slowest, lxml.html+XPath an order of magnitude faster"
    "type": "measured"
    "source": "12_speed.txt"
  - "id": "C5"
    "text": "find/find_all argument forms and outputs (name, list, True, class_, attrs dict with True, regex, string=, limit, recursive=False, function, id=); find → None"
    "type": "measured"
    "source": "03_find.txt"
  - "id": "C6"
    "text": "select/select_one forms (descendant, child, attribute prefix, union, nth-of-type, :has, :-soup-contains, first-child); equality with find_all/find"
    "type": "measured"
    "source": "04_select.txt"
  - "id": "C7"
    "text": ":-soup-contains() is a soupsieve extension; :has() supported"
    "type": "documented"
    "source": "https://facelessuser.github.io/soupsieve/selectors/ (accessed 2026-09-17)"
  - "id": "C8"
    "text": "Navigation outputs incl. .next_sibling = '\\n', contents types, 17 descendants vs 7 tags, find_next_sibling, find_previous_sibling, find_parent, next_element, find_next"
    "type": "measured"
    "source": "05_navigate.txt"
  - "id": "C9"
    "text": ".string None with several children; .get_text forms; .text alias; stripped_strings; tag[\"x\"] KeyError vs .get; class/rel lists; attrs dict"
    "type": "measured + documented"
    "source": "06_text_attrs.txt; bs4 docs \"Multi-valued attributes\", `.string`, `get_text()` (accessed 2026-09-17)"
  - "id": "C10"
    "text": "Modify outputs: .string=, class append, new_tag, append, insert, insert_before, decompose → None, extract → element, unwrap, wrap, prettified card"
    "type": "measured"
    "source": "07_modify.txt"
  - "id": "C11"
    "text": "Output: str, decode(formatter=\"html\"), decode(formatter=None), encode, prettify; formatter semantics"
    "type": "measured + documented"
    "source": "08_output.txt; bs4 docs \"Output formatters\" (accessed 2026-09-17)"
  - "id": "C12"
    "text": "Boolean attribute values are stringified (checked=\"True\", hidden=\"False\") on parsed and new tags with all three builders in 4.15.0; attrs class is AttributeDict; the 4.13.0 changelog describes spec-correct booleans (HTMLAttributeDict)"
    "type": "measured + documented"
    "source": "08_output.txt; bs4 4.15.0 sdist CHANGELOG, 4.13.0 \"Compatibility notices\"; `bs4/element.py` HTMLAttributeDict"
  - "id": "C13"
