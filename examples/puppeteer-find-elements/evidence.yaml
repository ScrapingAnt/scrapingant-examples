claims:
- id: PE1
  text: Global first/all selectors captured a preceding promotional decoy; scoped CSS, parent-handle queries and
    current XPath selected the three literal catalogue records.
  type: measured
  source: expected_output/chrome.json; oracle.mjs
- id: PE2
  text: Missing selectors returned null for dollar, an empty list for double-dollar and tested double-dollar-eval
    mapping, and an Error for dollar-eval.
  type: measured
  source: expected_output/chrome.json
- id: PE3
  text: Presence-only waiting returned empty title/price fields; waiting for populated fields returned the three
    exact records.
  type: measured
  source: expected_output/chrome.json
- id: PE4
  text: After same-document node replacement, the old detached handle still read its old title and a fresh query
    read the revised title.
  type: measured
  source: expected_output/chrome.json
- id: PE5
  text: The open-shadow selector and explicit frame query each read their separate record; ordinary main-document
    descendant CSS crossed neither boundary.
  type: measured
  source: expected_output/chrome.json
- id: PE6
  text: The tested missing optional attribute returned null; raw href stayed relative and the DOM href property
    resolved to an absolute URL.
  type: measured
  source: expected_output/chrome.json
- id: PT1
  text: In this fixture, innerText and browser Selection excluded the hidden/script/style sentinels; textContent
    included them.
  type: measured
  source: expected_output/chrome.json; expected_output/text-quickstart.json
- id: PT2
  text: HTML-to-text on raw HTTP HTML lacked populated catalogue titles; conversion of rendered HTML included them,
    while both conversions included the hidden sentinel and excluded script/style sentinels.
  type: measured
  source: expected_output/chrome.json; expected_output/text-quickstart.json
- id: PT3
  text: The selection implementation creates a DOM Range and reads Selection text without keyboard or clipboard
    interaction; no display-optimization recovery is established.
  type: implementation_limit
  source: text-quickstart.mjs; report.md
- id: PE7
  text: The oracle rejects malformed or mismatched literal records and the strict summary rejects changed raw data,
    fields, counts and case/round coverage.
  type: verified_implementation
  source: test/boundaries.test.mjs; test/summary.test.mjs; expected_output/test-results.json
- id: PE8
  text: Puppeteer documents current CSS, text, XPath and open-shadow selector forms and query methods that do not
    wait for populated page data.
  type: documented
  source: https://pptr.dev/guides/page-interactions
  accessed_at: 2026-09-28
limitations:
- Synthetic deterministic application on one Chrome build and host; no production reliability or speed inference.
- Chrome only; no Firefox, cross-origin iframe or closed-shadow-root measurement.
- Text checks assert declared sentinels, not identical whitespace across browsers/platforms.
- Population is released through an explicit fixture handshake; a real site's readiness predicate must match its
  data.
- Same-document detached-handle reading does not imply successful interaction or navigation survival.
- No Bing, keyboard, clipboard or generic display-optimization recovery test.
- No API called; shared javascript-dom-extraction packet owns ScrapingAnt behavior and live evidence.
- Development execution sandbox blocked DNS and loopback binding; authorized reruns kept Chrome's own sandbox enabled.
