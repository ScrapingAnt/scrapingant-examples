limitations:
- 'Existing owned fixtures only: measured results do not establish production reliability
  or total cash cost.'
- Controlled owned fixtures only; no real-world reliability, anti-bot, proxy quality
  or uptime result.
- Catalog records and delayed sentinel are different units and must not be pooled.
- Repeated observations are not new unique records or independent sites.
- Loopback timing is distinct from public-origin/API network paths; one reused browser,
  fresh contexts.
- CPU/memory, setup/maintenance labor, host/proxy cash and subscription allocation
  unmeasured.
- Final loopback capture overlapped a local blog build; public-origin acquisition
  had no concurrent build/render audit. Other host activity uncontrolled.
- No p95/p99 or statistical superiority conclusion; fixture intervals are descriptive.
- Named author review and completed four-arm independent review remain publication
  gates.
