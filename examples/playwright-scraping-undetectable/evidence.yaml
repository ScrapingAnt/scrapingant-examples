article_id: playwright-scraping-undetectable
canonical_url: https://scrapingant.com/blog/playwright-scraping-undetectable
owner: Oleg Kulyk
examples_repo_commit: 7f5d0a32057da5f771c18bf5e90ccd22163ee76a
source_commit_note: Executed implementation and primary captures; subsequent commits record metadata and review.
tested_at: '2026-09-22'
requires_api_key: false
environment:
  os: macOS 26.6.2 arm64
  python: 3.12.11
  node: 22.20.0
  local_fixture_chrome: 154.0.8037.57
  public_matrix_chrome: 153.0.8010.53
  firefox_control: '153.0'
  camoufox_browser: 152.0.4-beta.30
dependencies:
  playwright: 1.63.0
  patchright: 1.63.0
  playwright-stealth: 2.0.3
  playwright-extra: 4.3.6
  puppeteer-extra-plugin-stealth: 2.11.2
  rebrowser-playwright: 1.52.0
  camoufox: 0.5.6
  camoufox_environment_playwright: 1.62.0
run_command: BROWSER_CHANNEL=chrome CAMOUFOX_PYTHON=.venv-camoufox/bin/python ./run.sh --all
ci_run_command: ./run.sh
fixtures:
- fixtures/properties.html
outputs:
- expected_output/01_playwright.txt
- expected_output/02_patchright.txt
- expected_output/03_python_stealth.txt
- expected_output/04_extra_stealth.txt
- expected_output/05_rebrowser.txt
- expected_output/06_firefox.txt
- expected_output/07_camoufox.txt
- expected_output/browserscan-table.txt
measurements:
- name: Valid canonical BrowserScan captures
  value: 28
  denominator: 28
  unit: canonical observations, excluding two archived invalid pilots
  source: diagnostics/2026-09-22/summary.json
- name: Valid Sannysoft captures
  value: 14
  denominator: 14
  unit: canonical configuration/mode observations
  source: diagnostics/2026-09-22/summary.json
- name: Completed local article adapters
  value: 7
  denominator: 7
  unit: scripts
  source: expected_output/
limitations:
- Local article fixtures used Chrome154; public detector data used Chrome153. Do not transfer detector outcomes
  across these versions.
- Two BrowserScan repetitions and one Sannysoft visit per configuration/mode are exploratory observations, not success
  probabilities.
- A local file fixture is not proof of behavior on every HTTPS origin.
- Firefox control and Camoufox differ in build and fingerprint defaults; Chromium-only detector rows are not cross-engine
  scores.
- Rebrowser1.52 uses an older driver generation with newer installed Chrome; no general compatibility guarantee.
- The default CI job covers only three Python Chromium fixture adapters; full Node/Firefox and public diagnostics
  are separate.
- Invalid Node pilots and supplemental layout visits are retained separately from the canonical matrix.
- Default configurations were compared; no claim of best tuned configuration or of universal detection avoidance.
- No ScrapingAnt API, paid proxy, CAPTCHA solve, authenticated account or unrelated protected target was tested.
