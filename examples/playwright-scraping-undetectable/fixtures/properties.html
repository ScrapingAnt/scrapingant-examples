<!doctype html><html lang="en"><meta charset="utf-8"><title>Self-authored browser properties fixture</title><pre id="result">waiting</pre><script>
(async()=>{
 const c=document.createElement('canvas'), gl=c.getContext('webgl');
 const ext=gl&&gl.getExtension('WEBGL_debug_renderer_info');
 const result={webdriver:navigator.webdriver,ua:navigator.userAgent,platform:navigator.platform,languages:navigator.languages,plugins:[...navigator.plugins].map(x=>x.name),hardwareConcurrency:navigator.hardwareConcurrency,viewport:[innerWidth,innerHeight],screen:[screen.width,screen.height],webgl:ext?{vendor:gl.getParameter(ext.UNMASKED_VENDOR_WEBGL),renderer:gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)}:null};
 document.getElementById('result').textContent=JSON.stringify(result);
})();
</script></html>
