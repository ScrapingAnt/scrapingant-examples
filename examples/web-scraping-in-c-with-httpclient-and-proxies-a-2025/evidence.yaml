    type: measured
    source: expected_output/offline.txt
  - id: C4
    text: API 200 with unsuccessful or missing target status fails acceptance.
    type: measured
    source: expected_output/offline.txt
  - id: C14
    text: Source-shaped HTML success with absent outer type is accepted using the original target content-type; explicit non-HTML or invalid types and non-HTML bodies fail.
    type: measured
    source: expected_output/offline.txt
  - id: C5
    text: Missing, malformed or duplicate credit receipts fail acceptance rather than inventing a cost.
