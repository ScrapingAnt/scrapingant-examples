  - name: independent_oracle_mutation_controls_passed
    value: 5
    denominator: 5 deliberately corrupted output variants
    source: expected_output/oracle-controls.txt
  - name: simulated_records_matching_literal_oracle
    value: 2
    denominator: 2 simulated raw/rendered records, each with 4 required fields
    source: expected_output/results.json
