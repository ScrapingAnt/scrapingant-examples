    text: Two simulated raw/rendered HTML bodies produce the literal SKU, title, price and currency.
    type: measured
    source: expected_output/results.json
  - id: C3
    text: The empty application shell and missing or invalid required fields fail acceptance.
    type: measured
    source: expected_output/offline.txt
  - id: C4
    text: API 200 with unsuccessful or missing target status fails acceptance.
    type: measured
    source: expected_output/offline.txt
  - id: C5
    text: Missing, malformed or duplicate credit receipts fail acceptance rather than inventing a cost.
    type: measured
    source: expected_output/offline.txt
  - id: C6
    text: The client stops outer 400/403/404/405/409/422/423/429 with one attempt and sanitizes errors.
    type: measured
    source: expected_output/offline.txt
  - id: C7
    text: Transport and outer 500/502/503/504 retries are bounded to three attempts, with scheduled 1s/2s waits.
    type: measured
    source: expected_output/offline.txt
  - id: C8
    text: Cancellation before or during send, body read and backoff stops without automatic replacement.
    type: measured
    source: expected_output/offline.txt
