limitations:
  - No account or usage endpoint call; default client/parser run makes no API requests.
  - Catalog rendered HTML and credit receipts remain authored simulations; live-captures contains separate genuine owned-page responses and receipts.
  - The owned marker probe reused only BuildUri, not ManagedClient.FetchAsync, the SKU parser or public live CLI.
  - The separate October 12 native owned Product/Offer request exercised full FetchAsync; public CLI, real stores and arbitrary JSON-LD remain unverified.
  - UTF-8 fixture responses only; other target encodings require an adapter.
  - Three owned-page elapsed times are single observations, not production latency, throughput, reliability, CAPTCHA solving or paid capacity results.
  - The native source contains static JSON-LD; its rendered request does not establish JavaScript-driven product updates.
  - Delays are injected; schedule is tested without sleeping.
  - HTML parser may tolerate malformed markup; required schema validation is not universal HTML validation.
  - Optional live commands are illustrative and unexecuted; CLI performs one attempt each.
  - Named-author review is pending; full blog build and exact-head CI are separate pending gates.
  - Retrieval defaults differ across documentation and source; explicit settings avoid reliance on defaults.
