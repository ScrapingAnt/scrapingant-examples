article_id: wget-post-requests
canonical_url: https://scrapingant.com/blog/wget-post-requests
owner: Oleg Kulyk
examples_repo_commit: "198b96e"
tested_at: 2026-09-16
requires_api_key: false
environment:
  os: macOS 26 (Darwin 25.6.0, arm64)
  wget: "GNU Wget 1.25.0 (Homebrew)"
  curl: "8.7.1"
  python: "3.10.14 (server.py only)"
dependencies: {}
run_command: ./run.sh
fixtures:
  - fixtures/data.json, fixtures/form.txt
  - server.py (local echo/redirect/auth/cookie/flaky/slow endpoints on 127.0.0.1:8000)
outputs:
  - expected_output/00_versions.txt … 20_post_data_and_file.txt (one file per case)
  - server.log (request sequence)
measurements: []
limitations:
  - wget 1.25.0 only locally; CI records Ubuntu's wget (redirect handling may differ by version).
  - No HTTPS target; the ScrapingAnt API call is documented, not run.
claims:   # ids match briefs/wget-post-requests.ledger.md in seo_optimisation
  - "id": "C1"
    "text": "--post-data makes a POST with Content-Type: application/x-www-form-urlencoded, body as given; echo quoted"
    "type": "measured"
    "source": "01_post_data.txt"
  - "id": "C2"
    "text": "--header='Content-Type: application/json' replaces the default content type"
    "type": "measured"
    "source": "02_post_json.txt"
  - "id": "C3"
    "text": "--post-file sends the file contents (36 bytes incl. newline) with the given header"
    "type": "measured"
    "source": "03_post_file.txt"
  - "id": "C4"
    "text": "--post-file=/dev/stdin → \"Illegal seek\", --post-file=- → \"No such file\", exit 3; --post-data with --post-file → refused, exit 1"
    "type": "measured"
    "source": "10_post_file_stdin.txt, 20_post_data_and_file.txt"
  - "id": "C5"
    "text": "Manual: wget needs the size of the POST data in advance; --post-file must be a regular file; FIFO or /dev/stdin won't work; no multipart/form-data support; only one of the two options"
    "type": "documented"
    "source": "GNU Wget manual, `--post-data`/`--post-file` (accessed 2026-09-16)"
  - "id": "C6"
    "text": "--method=PUT --body-file and --method=POST --body-data echo as shown; --method=POST --body-data gives the same request as --post-data incl. default content type"
    "type": "measured"
    "source": "04_method_body.txt, 05_method_post_body_data.txt"
  - "id": "C7"
    "text": "Manual: --body-data/--body-file \"work in exactly the same way\" as the --post-* pair; --method sends other HTTP methods"
    "type": "documented"
    "source": "GNU Wget manual, `--method`, `--body-data` (accessed 2026-09-16)"
  - "id": "C8"
    "text": "-S prints response headers even with -q"
    "type": "measured"
    "source": "06_server_response.txt"
  - "id": "C9"
    "text": "On a 400, default wget prints \"ERROR 400\" and no body; -O file created with 0 bytes; --content-on-error keeps the body; exit 8"
    "type": "measured"
    "source": "07_error_no_body.txt, 08_content_on_error.txt"
  - "id": "C10"
    "text": "Manual: --content-on-error \"will not skip the content when the server responds with a http status code that indicates error\""
    "type": "documented"
    "source": "GNU Wget manual, `--content-on-error` (accessed 2026-09-16)"
  - "id": "C11"
    "text": "Redirect behaviour on 1.25.0: 301/302/303 → GET, no body, no content type; 307/308 → POST with body"
    "type": "measured"
    "source": "09_redirect_301..308.txt"
  - "id": "C12"
    "text": "Manual text: 301/302/307 \"continue to send a POST request\"; 303 for a method change"
    "type": "documented"
    "source": "GNU Wget manual, note under `--post-data` (\"As of version 1.15 …\") (accessed 2026-09-16)"
  - "id": "C13"
    "text": "Browsers and RFC 9110 treat 301/302 as method-changing to GET in practice"
    "type": "documented"
    "source": "RFC 9110 §15.4.2–15.4.3 (\"a user agent MAY change the request method from POST to GET\") (accessed 2026-09-16)"
  - "id": "C14"
    "text": "Raw --post-data 'q=hello world&note=a&b=c' parses as q, note=a, b=c; urllib.parse.urlencode form arrives as q=hello+world&note=a%26b%3Dc and parses correctly"
    "type": "measured"
    "source": "11_no_encoding.txt, 12_urlencode.txt"
  - "id": "C15"
    "text": "Login sequence with --keep-session-cookies → \"hello foo\"; cookie line with expiry 0; without it, grep -c session = 0; /me without cookies → \"Username/Password Authentication Failed.\" exit 6"
    "type": "measured"
    "source": "13_login_cookies.txt, 13c_save_without_keep.txt, 13b_no_cookies.txt"
  - "id": "C16"
    "text": "Manual: --save-cookies does not save session cookies; --keep-session-cookies saves them with expiry 0; Netscape format"
    "type": "documented"
    "source": "GNU Wget manual, `--save-cookies`, `--keep-session-cookies` (accessed 2026-09-16)"
  - "id": "C17"
    "text": "Basic auth: 401 challenge then second POST with Authorization; --auth-no-challenge sends it on the first request"
    "type": "measured"
    "source": "14_basic_auth.txt, 15_auth_no_challenge.txt"
  - "id": "C18"
    "text": "Manual: --auth-no-challenge \"not recommended\", for servers that never send challenges; sends plaintext credentials for all requests; 1.10.2 and prior did so by default"
    "type": "documented"
    "source": "GNU Wget manual, `--auth-no-challenge` (accessed 2026-09-16)"
  - "id": "C19"
    "text": "Default --tries=3 does not retry a 503 (exit 8); --retry-on-http-error=503 --waitretry=1 succeeds and the body is re-sent (server received three POSTs)"
    "type": "measured"
    "source": "16_retry_default.txt, 17_retry_on_503.txt, server.log"
  - "id": "C20"
    "text": "Manual: --tries default 20; --retry-on-http-error treats codes as transient, \"generally not recommended\"; --waitretry linear backoff up to the given seconds; default read timeout 900 s; --timeout sets DNS/connect/read at once"
    "type": "documented"
    "source": "GNU Wget manual, `--tries`, `--retry-on-http-error`, `--waitretry`, `--timeout` (accessed 2026-09-16)"
  - "id": "C21"
    "text": "--read-timeout=1 --tries=1 on a 3 s endpoint → \"Read error (Operation timed out) in headers.\" exit 4"
    "type": "measured"
    "source": "18_read_timeout.txt"
  - "id": "C22"
    "text": "curl -F produces multipart/form-data with the file part; body quoted with boundary masked"
    "type": "measured"
    "source": "19_curl_multipart.txt"
  - "id": "C23"
    "text": "Exit codes 0/1/3/4/6/8 meanings"
    "type": "documented"
    "source": "GNU Wget manual, \"Exit Status\" (accessed 2026-09-16)"
  - "id": "C24"
    "text": "ScrapingAnt: POST/PUT/DELETE forwarded transparently with x-api-key and url; Ant-Content-Type header"
    "type": "product"
    "source": "registry `api.post_forwarding` (verified)"
  - "id": "C25"
    "text": "Versions: GNU Wget 1.25.0, curl 8.7.1"
    "type": "measured"
    "source": "00_versions.txt"
  - "id": "C26"
    "text": "Server log shows the request sequence (redirect → GET or POST; three POSTs for 14 and 17)"
    "type": "measured"
    "source": "server.log (kept in the packet)"
