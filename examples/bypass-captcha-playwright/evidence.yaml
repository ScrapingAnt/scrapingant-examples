limitations:
- Test keys intentionally bypass real challenge uncertainty; successes establish application
  integration only.
- One ScrapingAnt browser/datacenter fetch returned the demo widget markup; no response
  textarea or success message was found. No form submission or server acceptance was
  tested; this is not CAPTCHA solving evidence.
- Three audio trials use different attempt budgets. Fresh browser contexts share one
  host/IP and sequential ordering; no causal headed/headless claim. Headless shell
  differs from headed Chromium.
- Python audio library uses external Google speech recognition and needs FFmpeg; not
  a purely local solution.
- 'Default CI scope: offline spending/privacy assertions, provider test-key integration
  and SDK interface/preflight only. No live demo, audio, paid service or product API
  run.'
- No claim that browser stealth implies CAPTCHA solving.
- Dated historical screenshots/results remain illustrative observations; external
  widgets may change.
- Two trials per provider on one public demo; no reliability, speed or price ranking.
- Proxyless providers use their own solver infrastructure/IPs; only the submitting
  browser host is shared.
- Synchronous SDK entry points tested; no async throughput measurement.
- SIGALRM is an intended interruption; the separate process timeout bounded local
  execution.
- 2Captcha task charges were not exposed in the captured SDK response; no total combined
  cost inferred.
- CapSolver installed/imported but remains unavailable without a key.
- The initial public-demo rejection assertion checked the wrong message; corrected
  to observed wording and rerun successfully. Both captures are retained.
