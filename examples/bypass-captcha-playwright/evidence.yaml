limitations:
- Test keys intentionally bypass real challenge uncertainty; successes establish application integration
  only.
- One ScrapingAnt browser/datacenter fetch returned the demo widget markup; no response textarea or success
  message was found. No form submission or server acceptance was tested; this is not CAPTCHA solving evidence.
- Three audio trials use different attempt budgets. Fresh browser contexts share one host/IP and sequential
  ordering; no causal headed/headless claim. Headless shell differs from headed Chromium.
- Python audio library uses external Google speech recognition and needs FFmpeg; not a purely local solution.
- 'Default CI scope: offline spending/privacy assertions, provider test-key integration and SDK interface/preflight
  only. No live demo, audio, paid service or product API run.'
- No claim that browser stealth implies CAPTCHA solving.
- Dated historical screenshots/results remain illustrative observations; external widgets may change.
- 'Initial four-task cohort only: Two trials per provider on one public demo; no reliability, speed or
  price ranking.'
- Proxyless providers use their own solver infrastructure/IPs; only the submitting browser host is shared.
- Synchronous SDK entry points tested; no async throughput measurement.
- SIGALRM is an intended interruption; the separate process timeout bounded local execution.
- 'Initial four-task cohort only: 2Captcha task charges were not exposed in the captured SDK response;
  no total combined cost inferred.'
- CapSolver installed/imported but remains unavailable without a key.
- The initial public-demo rejection assertion checked the wrong message; corrected to observed wording
  and rerun successfully. Both captures are retained.
- Historical initial broad matrix has ten trials per provider/case on one host/network; up to four concurrent
  child processes, at most two per provider. SDK polling differs. No causal speed or population reliability
  ranking.
- 'Turnstile broad observations measure token delivery only: the selected fixture has no server verifier.'
- Historical initial image-text trials use ten simple synthetic OCR images, not a representative production
  CAPTCHA dataset.
- GeeTest verification is hosted by one compared provider. v3/GeeTest use demo verification endpoints
  rather than a full form flow.
- Immediate v3 token replays were accepted by the demo; cause unestablished. Do not infer production replay
  resistance. GeeTest rejected both replay probes.
- Provider errors are retained without replacement; missing cost receipts remain unknown. Balance deltas
  may include other account activity or refunds.
- Invisible-v2 screenshots were excluded because token text overflowed the mask. Structured outcomes are
  retained; future runner captures omit these screenshots.
- Expanded matrix has 100 trials per provider/case. The original 10 used up to 4 concurrent jobs, 2 per
  provider; the added 90 used up to 12 jobs, 6 per provider, with any uncharged setup recovery recorded
  separately. Time window and concurrency differ; phase summaries are supplied.
- Expanded OCR uses 100 distinct deterministic synthetic images, paired byte-for-byte across providers;
  this does not represent production CAPTCHA diversity.
- Only proven uncharged fixture-setup failures were archived and explicitly resumed. Original diagnostics
  are retained separately; paid failures were not replaced.
- Expanded sample remains restricted to the same public demo fixtures, submitting host/network and provider
  networks. Counts and percentiles do not establish general reliability or a causal provider ranking.
