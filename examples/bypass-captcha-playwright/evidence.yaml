limitations:
- Test keys intentionally bypass real challenge uncertainty; successes establish application
  integration only.
- Three SDKs were installed/imported but not exercised with funded credentials. No
  paid service comparison, accuracy, cost or latency measured.
- SCRAPINGANT_API_KEY unavailable; probe exited2 before HTTP; no product API response
  exists. Credentialed probe code is prepared, not validated.
- Three audio trials use different attempt budgets. Fresh browser contexts share one
  host/IP and sequential ordering; no causal headed/headless claim. Headless shell
  differs from headed Chromium.
- No production-demo token was submitted. Rate limits and solve errors are preserved,
  not counted as successes.
- Python audio library uses external Google speech recognition and needs FFmpeg; not
  a purely local solution.
- 'Default CI scope: provider test-key integration and SDK interface/preflight only.
  No live demo, audio, paid service or product API run.'
- No claim that browser stealth implies CAPTCHA solving.
- Dated historical screenshots/results remain illustrative observations; external
  widgets may change.
