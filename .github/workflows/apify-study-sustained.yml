name: Apify sustained validation (guard closed)
on:
  push:
    paths:
      - 'examples/apify-sustained/**'
      - '.github/workflows/apify-study-sustained.yml'
  workflow_dispatch:
    inputs:
      reviewed_action:
        description: Exact monthly two-GET read or one held-out LIMITED run; independent closed guards
        type: choice
        required: true
        default: offline
        options:
          - offline
          - read-only-monthly
          - sustained
permissions:
  contents: read
concurrency:
  group: apify-study-smoke
  cancel-in-progress: false
jobs:
  sustained:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed authenticated age binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age-v1.3.2"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/age-v1.3.2/age.tar.gz"
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age-v1.3.2/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age-v1.3.2/age.tar.gz" -C "$RUNNER_TEMP/age-v1.3.2" age/age age/LICENSE
      - name: Secret-free deterministic controller and encryption-bound tests
        working-directory: examples/apify-sustained
        env:
          SUSTAINED_TEST_AGE_BIN: ${{ runner.temp }}/age-v1.3.2/age/age
        run: python -B -m unittest discover -p 'test_*.py'
      - name: Separate exact monthly product-billing two-GET projection
        if: github.event_name == 'workflow_dispatch' && (inputs.reviewed_action == 'read-only-monthly')
        working-directory: examples/apify-sustained
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python billing_readonly.py --execute
      - name: Encrypted monthly projection and fixed public states only
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.reviewed_action == 'read-only-monthly')
        uses: actions/upload-artifact@v4
        with:
          name: apify-sustained-encrypted-monthly-usage
          path: |
            examples/apify-sustained/monthly-usage.age
            examples/apify-sustained/monthly-usage-public.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Exactly one fixed reviewed LIMITED capture
        if: github.event_name == 'workflow_dispatch' && (inputs.reviewed_action == 'sustained')
        working-directory: examples/apify-sustained
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python workflow_driver.py capture --cell sustained-playwright-c5-7680 --execute
      - name: Authenticated encrypted capture and safe hashes only
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.reviewed_action == 'sustained')
        uses: actions/upload-artifact@v4
        with:
          name: apify-sustained-encrypted-capture-sustained-playwright-c5-7680
          path: |
            examples/apify-sustained/capture.age
            examples/apify-sustained/capture-public.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Exact local durable readback approval then bounded fresh cleanup
        if: success() && github.event_name == 'workflow_dispatch' && (inputs.reviewed_action == 'sustained')
        working-directory: examples/apify-sustained
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python workflow_driver.py cleanup --cell sustained-playwright-c5-7680 --execute
      - name: Authenticated encrypted final receipt and safe cleanup status only
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.reviewed_action == 'sustained')
        uses: actions/upload-artifact@v4
        with:
          name: apify-sustained-encrypted-final-sustained-playwright-c5-7680
          path: |
            examples/apify-sustained/final.age
            examples/apify-sustained/final-public.json
          if-no-files-found: ignore
          retention-days: 7
