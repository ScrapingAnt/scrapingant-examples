name: Exact WCC terminal and stores recovery (guard closed)
on:
  push:
    paths:
      - 'examples/apify-wcc-readonly-recovery/**'
      - '.github/workflows/apify-wcc-readonly-recovery.yml'
  workflow_dispatch:
    inputs:
      execute_readonly_recovery:
        description: Six fixed existing-run/store metadata GETs; no start, abort, items or deletion
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: apify-wcc-readonly-recovery
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Named synthetic fixed-scope, transport and privacy tests
        working-directory: examples/apify-wcc-readonly-recovery
        run: python -B -m unittest test_recover_wcc.py
  recovery:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && inputs.execute_readonly_recovery && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing official age version at pinned digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age-v1.3.2"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/age-v1.3.2/age.tar.gz"
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age-v1.3.2/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age-v1.3.2/age.tar.gz" -C "$RUNNER_TEMP/age-v1.3.2" age/age age/LICENSE
      - name: Committed WCC run with existing provider credential and exact data-only target
        working-directory: examples/apify-wcc-readonly-recovery
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_WCC_RECOVERY_TARGET: ${{ secrets.APIFY_WCC_RECOVERY_TARGET }}
        run: python -B recover_wcc.py --execute
      - name: Only encrypted native bodies and fixed public diagnostic states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apify-wcc-encrypted-readonly-recovery
          path: |
            examples/apify-wcc-readonly-recovery/capture/run.age
            examples/apify-wcc-readonly-recovery/capture/dataset.age
            examples/apify-wcc-readonly-recovery/capture/kv.age
            examples/apify-wcc-readonly-recovery/capture/queue.age
            examples/apify-wcc-readonly-recovery/capture/extra.age
            examples/apify-wcc-readonly-recovery/capture/meter.age
            examples/apify-wcc-readonly-recovery/capture/manifest.age
            examples/apify-wcc-readonly-recovery/capture/recovery-public.json
          if-no-files-found: ignore
          retention-days: 7
