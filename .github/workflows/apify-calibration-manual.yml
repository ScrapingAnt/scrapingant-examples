name: Apify calibration manual (guard closed after single dispatch)

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Single authorization consumed; guard closed, do not execute again
        type: boolean
        required: true
        default: false
      build:
        description: Immutable public apify/web-scraper build number; leave blank for an offline plan
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: apify-calibration-manual
  cancel-in-progress: false

jobs:
  calibration:
    # Main only. Workflow re-runs cannot initiate another provider run.
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reserve execution and cleanup time within the job limit
        run: |
          python3 - <<'PYTIME'
          import os
          import time
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'APIFY_CALIBRATION_WALL_DEADLINE={time.monotonic() + 540:.6f}\n')
          PYTIME
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests and unexecuted plan
        working-directory: examples/apify-calibration
        run: ./run.sh
      - name: Offline preview of requested build
        if: inputs.build != ''
        working-directory: examples/apify-calibration
        env:
          APIFY_CALIBRATION_BUILD: ${{ inputs.build }}
        run: python calibration.py --plan --build "$APIFY_CALIBRATION_BUILD"
      - name: Secret-free reviewed guard check
        if: inputs.execute
        working-directory: examples/apify-calibration
        env:
          APIFY_CALIBRATION_BUILD: ${{ inputs.build }}
        run: python calibration.py --check-readiness --build "$APIFY_CALIBRATION_BUILD"
      - name: Live mode blocked by consumed authorization
        if: success() && inputs.execute && github.ref == 'refs/heads/main' && github.run_attempt == 1
        working-directory: examples/apify-calibration
        env:
          APIFY_CALIBRATION_BUILD: ${{ inputs.build }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python calibration.py --execute --build "$APIFY_CALIBRATION_BUILD"
      - name: Retain sanitized calibration receipt even after a stopped run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apify-calibration-sanitized-receipt
          path: examples/apify-calibration/calibration-receipt.json
          if-no-files-found: ignore
          retention-days: 7
