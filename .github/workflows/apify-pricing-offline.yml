name: Apify pricing offline worksheet
on:
  push:
    branches: [main]
    paths:
      - 'examples/apify-pricing/**'
      - '.github/workflows/apify-pricing-offline.yml'
  pull_request:
    paths:
      - 'examples/apify-pricing/**'
      - '.github/workflows/apify-pricing-offline.yml'
permissions:
  contents: read
jobs:
  worksheet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: examples/apify-pricing/run.sh
