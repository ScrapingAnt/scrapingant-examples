name: Apify calibration offline

on:
  push:
    branches: [main]
    paths:
      - examples/apify-calibration/**
      - .github/workflows/apify-calibration-manual.yml
      - .github/workflows/apify-calibration-offline.yml
      - .github/workflows/apify-diagnosis-readonly.yml
      - .github/workflows/apify-coverage-readonly.yml
  pull_request:
    paths:
      - examples/apify-calibration/**
      - .github/workflows/apify-calibration-manual.yml
      - .github/workflows/apify-calibration-offline.yml
      - .github/workflows/apify-diagnosis-readonly.yml
      - .github/workflows/apify-coverage-readonly.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Standard-library tests and offline plan
        working-directory: examples/apify-calibration
        run: ./run.sh
      - name: Read-only diagnostic rejection tests
        working-directory: examples/apify-calibration
        run: python -m unittest test_diagnosis.py
      - name: Wider read-only coverage tests
        working-directory: examples/apify-calibration
        run: python -m unittest test_coverage.py
