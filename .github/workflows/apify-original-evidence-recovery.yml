name: Exact original Apify evidence recovery (guard closed)
on:
  push:
    paths:
      - 'examples/apify-original-recovery/**'
      - '.github/workflows/apify-original-evidence-recovery.yml'
  workflow_dispatch:
    inputs:
      execute_readonly_recovery:
        description: Seven fixed original-scope GETs; encrypted raw evidence only
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: apify-original-evidence-recovery
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Secret-free deterministic scope, transport and privacy tests
        working-directory: examples/apify-original-recovery
        run: python -B -m unittest test_recover_original.py
  recovery:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && inputs.execute_readonly_recovery && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official age at the fixed reviewed version and digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age-v1.3.2"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/age-v1.3.2/age.tar.gz"
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age-v1.3.2/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age-v1.3.2/age.tar.gz" -C "$RUNNER_TEMP/age-v1.3.2" age/age age/LICENSE
      - name: Original evidence recovery using the existing configured secret
        working-directory: examples/apify-original-recovery
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -B recover_original.py --execute
      - name: Only age ciphertext and fixed public states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apify-original-evidence-encrypted-recovery
          path: |
            examples/apify-original-recovery/run.age
            examples/apify-original-recovery/dataset.age
            examples/apify-original-recovery/raw.age
            examples/apify-original-recovery/clean.age
            examples/apify-original-recovery/projection.age
            examples/apify-original-recovery/log.age
            examples/apify-original-recovery/manifest.age
            examples/apify-original-recovery/recovery-public.json
          if-no-files-found: ignore
          retention-days: 7
