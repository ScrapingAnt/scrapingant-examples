name: Employer job collection offline evidence
on:
  pull_request:
    paths:
      - 'examples/scraping-for-labor-market-intelligence-jobs-skills-and-wage/**'
      - '.github/workflows/employer-jobs-offline.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
      - name: Test loopback fixtures and verify stored captures
        working-directory: examples/scraping-for-labor-market-intelligence-jobs-skills-and-wage
        run: PYTHON_BIN=python ./run.sh --check
