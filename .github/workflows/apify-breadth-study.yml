name: Apify Actor breadth study (one cell, guard closed)
on:
  push:
    paths:
      - 'examples/apify-breadth-study/**'
      - '.github/workflows/apify-breadth-study.yml'
  workflow_dispatch:
    inputs:
      cell:
        description: Exact reviewed cell; source guard must match; one dispatch only
        type: choice
        required: true
        options:
          - breadth-r1-web
          - breadth-r1-playwright
          - breadth-r1-puppeteer
          - breadth-r1-rag
          - breadth-r1-google-search
          - breadth-r1-ai-web
          - breadth-r1-trends
          - breadth-r2-web
          - breadth-r2-playwright
          - breadth-r2-puppeteer
          - breadth-r2-rag
          - breadth-r2-google-search
          - breadth-r2-ai-web
          - breadth-r3-web
          - breadth-r3-playwright
          - breadth-r3-puppeteer
          - breadth-r3-rag
          - breadth-r3-google-search
          - breadth-r3-ai-web
      execute_reviewed_cell:
        description: One paid start, fixed cap, encrypted capture; no cleanup
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: apify-study-smoke
  cancel-in-progress: false
jobs:
  offline:
    strategy:
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Secret-free deterministic bounds and manifest tests
        working-directory: examples/apify-breadth-study
        run: python -B -m unittest discover -p 'test_*.py'
  capture:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.execute_reviewed_cell
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed authenticated age binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age-v1.3.2"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/age-v1.3.2/age.tar.gz"
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age-v1.3.2/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age-v1.3.2/age.tar.gz" -C "$RUNNER_TEMP/age-v1.3.2" age/age age/LICENSE
      - name: Exactly one reviewed cell using existing secret
        working-directory: examples/apify-breadth-study
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          REVIEWED_CELL: ${{ inputs.cell }}
        run: python -B controller.py --cell "$REVIEWED_CELL" --execute
      - name: Encrypted raw evidence and fixed public states only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apify-breadth-study-${{ inputs.cell }}
          path: |
            examples/apify-breadth-study/capture/*.age
            examples/apify-breadth-study/capture/capture-public.json
          if-no-files-found: ignore
          retention-days: 7
