name: Apify monthly usage diagnostic (guard closed)
on:
  push:
    paths:
      - 'examples/apify-billing-reconcile/**'
      - '.github/workflows/apify-billing-reconcile.yml'
  workflow_dispatch:
    inputs:
      reviewed_action:
        description: Exact fixed monthly two-GET read; closed guard
        type: choice
        required: true
        default: offline
        options:
          - offline
          - read-only-monthly
permissions:
  contents: read
concurrency:
  group: apify-study-smoke
  cancel-in-progress: false
jobs:
  billing:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed authenticated age binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age-v1.3.2"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/age-v1.3.2/age.tar.gz"
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$RUNNER_TEMP/age-v1.3.2/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age-v1.3.2/age.tar.gz" -C "$RUNNER_TEMP/age-v1.3.2" age/age age/LICENSE
      - name: Secret-free deterministic read-only projection tests
        working-directory: examples/apify-billing-reconcile
        run: python -B -m unittest discover -p 'test_*.py'
      - name: Separate exact monthly product-billing two-GET projection
        if: github.event_name == 'workflow_dispatch' && (inputs.reviewed_action == 'read-only-monthly')
        working-directory: examples/apify-billing-reconcile
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python billing_readonly.py --execute
      - name: Encrypted monthly projection and fixed public states only
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.reviewed_action == 'read-only-monthly')
        uses: actions/upload-artifact@v4
        with:
          name: apify-billing-reconcile-encrypted-monthly-usage
          path: |
            examples/apify-billing-reconcile/monthly-usage.age
            examples/apify-billing-reconcile/monthly-usage-public.json
          if-no-files-found: ignore
          retention-days: 7
